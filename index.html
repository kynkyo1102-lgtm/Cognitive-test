<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたの頭は、何に引っかかる？ | 認知癖診断 v0.5</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-align: right;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .scenario-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            background-color: #eef2ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .instruction-prompt {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        /* 結果画面 */
        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .result-subtitle {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 32px auto;
        }

        /* 取扱説明書カード */
        .instruction-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .instruction-header {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-box {
            margin-bottom: 16px;
        }

        .section-box:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-content {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
            margin: 0;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            margin-top: 16px;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="quiz-screen">
        <div class="progress-container">
            <div class="progress-text" id="progress-text">Q1 / 40</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
        <div class="scenario-badge">シナリオ問題</div>
        <div class="question-title" id="question-text">シナリオ文がここに表示されます</div>
        <div class="instruction-prompt">あなたが最も真っ先に引っかかる（モヤッとする）ポイントは？</div>
        <div class="options-container" id="options-container">
            <!-- 5つの選択肢ボタン -->
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title">あなたの認知癖・思考傾向</div>
        <div class="result-subtitle">無意識の着眼点分析 ＆ あなたの取扱説明書</div>
        
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="instruction-card">
            <div class="instruction-header" id="type-title">あなたのメイン思考タイプ</div>
            
            <div class="section-box">
                <div class="section-title">💪 強み・発揮できる才能</div>
                <p class="section-content" id="type-strength"></p>
            </div>

            <div class="section-box">
                <div class="section-title">⚠ 陥りがちな罠・コミュニケーションの摩擦</div>
                <p class="section-content" id="type-trap"></p>
            </div>

            <div class="section-box">
                <div class="section-title">💡 トラブルを防ぐ処方箋・活用術</div>
                <p class="section-content" id="type-prescription"></p>
            </div>

            <div class="section-box">
                <div class="section-title">🚀 輝く環境・向いているポジション</div>
                <p class="section-content" id="type-environment"></p>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 40問のシナリオ問題（各問題に5つの思考軸の選択肢を用意）
    const questions = [
        {
            text: "同僚「この新商品はSNSで大人気で、満足度98%なんです！すぐに我が社でも導入しましょう！」",
            options: [
                { axis: "definition", text: "「満足度」ってどういう設問で聞いた結果のこと？" },
                { axis: "causality", text: "SNSで人気なことと我が社で成功する理屈が繋がってなくない？" },
                { axis: "population", text: "それって何人を対象に調査したデータなの？" },
                { axis: "applicability", text: "他社の客層と我が社の客層の違いを考慮した？" },
                { axis: "uncertainty_low", text: "もし失敗した時のリスクや撤退基準は決まってる？" }
            ]
        },
        {
            text: "上司「来期の目標は『チーム全員でイノベーションを起こす』ことに決まったから、よろしく！」",
            options: [
                { axis: "definition", text: "具体的に何をもって『イノベーション』と呼ぶのか定義してほしい。" },
                { axis: "causality", text: "どういうアクションを起こせばイノベーションに繋がるのか仕組みが見えない。" },
                { axis: "population", text: "全員って言っても、部署や職種によって状況が全く違うのでは？" },
                { axis: "applicability", text: "うちの現行業務のリソースで、本当にその目標が適用できるのか？" },
                { axis: "uncertainty_low", text: "評価基準や達成目標が曖昧すぎて何をすればいいかわからない。" }
            ]
        },
        {
            text: "ネット記事「成功者はみんな朝5時に起きている！あなたも明日から朝型になろう」",
            options: [
                { axis: "definition", text: "ここで言う「成功者」の定義って年収？ポジション？何のこと？" },
                { axis: "causality", text: "「朝起きること」が「成功」に繋がる直接の因果関係はあるの？" },
                { axis: "population", text: "夜型で成功した人のデータや全体の割合は無視されてない？" },
                { axis: "applicability", text: "体質や生活リズムが違う自分にも再現できる話なのだろうか？" },
                { axis: "uncertainty_low", text: "いきなり生活習慣を変えて体調を崩すリスクはないのだろうか？" }
            ]
        },
        {
            text: "友人「このサプリ飲んだら1ヶ月で5キロ痩せたよ！絶対に試した方がいい！」",
            options: [
                { axis: "definition", text: "脂肪が減ったのか水分が抜けたのか、何の5キロなのか気になる。" },
                { axis: "causality", text: "サプリのどんな成分がどう作用して痩せたのかメカニズムを知りたい。" },
                { axis: "population", text: "たった1人の体験談（N=1）で効果があると決めつけるのは危険。" },
                { axis: "applicability", text: "食事制限や運動など、友人と同じ条件を自分も揃えられるか？" },
                { axis: "uncertainty_low", text: "副作用や健康被害のリスクがないか安全性が確定していない。" }
            ]
        },
        {
            text: "後輩「〇〇さん（先輩）がこう言っていたので、このやり方で進めておきました！」",
            options: [
                { axis: "definition", text: "先輩の発言のニュアンスや具体的な言葉の意図を正確に確認した？" },
                { axis: "causality", text: "なぜそのやり方が最適と言えるのか、筋道立てて説明できる？" },
                { axis: "population", text: "1人の先輩の意見だけで進めず、他の人の意見も聞いた？" },
                { axis: "applicability", text: "今回のケースと先輩が言っていたケースは前提条件が違わない？" },
                { axis: "uncertainty_low", text: "事前に進めてトラブルが起きた時の責任はどうするつもり？" }
            ]
        },
        {
            text: "ニュース「〇〇業界が空前の大ブーム！参入企業が相次いでいます」",
            options: [
                { axis: "definition", text: "何をもって「空前の大ブーム」と表現しているのか基準がわからない。" },
                { axis: "causality", text: "なぜ今そのブームが起きているのか構造的な理由が知りたい。" },
                { axis: "population", text: "一部の注目企業だけでなく業界全体の何%が儲かっているのか？" },
                { axis: "applicability", text: "今から自社が参入して本当に先行者と同じように通用するのか？" },
                { axis: "uncertainty_low", text: "ブームが去った後の撤退リスクや損失の対策はあるのか？" }
            ]
        },
        {
            text: "コンサルタント「他社で大成功したこのフレームワークを導入すれば、業務効率が劇的に上がります」",
            options: [
                { axis: "definition", text: "ここで言う「業務効率」とは具体的にどの指標のことか？" },
                { axis: "causality", text: "フレームワークを当てはめるだけで効率が上がる理屈が不明。" },
                { axis: "population", text: "成功した他社は何社中何社？失敗事例の割合は？" },
                { axis: "applicability", text: "自社の独特な現場オペレーションにそのまま適用できるのか？" },
                { axis: "uncertainty_low", text: "導入途中で現場が混乱したり停滞するリスクのケアはあるのか？" }
            ]
        },
        {
            text: "店員「当店で一番人気のメニューです！迷ったらこれにすれば間違いありません！」",
            options: [
                { axis: "definition", text: "「一番人気」とは注文数のこと？売上金額のこと？" },
                { axis: "causality", text: "なぜ人気なのか、味やコスパなどの理由がわからない。" },
                { axis: "population", text: "どんな客層（男女比や年齢層）に人気なのかで話が変わる。" },
                { axis: "applicability", text: "他人の好みが自分の好みにそのまま当てはまるとは限らない。" },
                { axis: "uncertainty_low", text: "万が一好みに合わなかった時のガッカリ感を避けたい。" }
            ]
        },
        {
            text: "セミナー講師「自由で柔軟な思考こそが、これからの時代に求められるスキルです」",
            options: [
                { axis: "definition", text: "「自由で柔軟な思考」の具体的な定義や状態とは？" },
                { axis: "causality", text: "それがなぜ成果や結果に繋がるのか論理的説明が欲しい。" },
                { axis: "population", text: "自由な思考を求めていない職種や業界もたくさんあるのでは？" },
                { axis: "applicability", text: "明日からの自分の日常業務で具体的にどう使えばいいのか？" },
                { axis: "uncertainty_low", text: "ルールや基準がない中で動くのは危険ではないのか？" }
            ]
        },
        {
            text: "取引先「とりあえずざっくりとした見積もりだけ先に送ってください！」",
            options: [
                { axis: "definition", text: "「ざっくり」の範囲や必要な項目の定義をすり合わせたい。" },
                { axis: "causality", text: "要件が決まっていないのに金額が出る理屈が通らない。" },
                { axis: "population", text: "他社にはどんな基準で見積もりを出しているのか知りたい。" },
                { axis: "applicability", text: "過去の案件の金額を今回のケースにそのまま適用して良いのか？" },
                { axis: "uncertainty_low", text: "後から「話が違う」と揉めるリスクを絶対に避けたい。" }
            ]
        },
        // 11〜40問目（同様に5つの着眼点を網羅したシナリオ）
        {
            text: "書籍「これ1冊でOK！誰でもわかるマーケティングの基本」",
            options: [
                { axis: "definition", text: "「マーケティングの基本」の範囲がどこまでか不明。" },
                { axis: "causality", text: "なぜこれを読めば「わかる」ようになるのか根拠が薄い。" },
                { axis: "population", text: "「誰でも」は言い過ぎで、人によって難易度は違うはず。" },
                { axis: "applicability", text: "BtoBや専門的な自分のビジネスにも適用できるのか？" },
                { axis: "uncertainty_low", text: "情報が古かったり間違っていたりするリスクはないか。" }
            ]
        },
        {
            text: "企画書「AIを活用して、業務時間を50%削減します」",
            options: [
                { axis: "definition", text: "削減対象の「業務時間」とはどの作業のこと？" },
                { axis: "causality", text: "AI導入から50%削減に至る具体的なプロセスが見えない。" },
                { axis: "population", text: "一部の作業だけ50%減っても全体では数%じゃないか？" },
                { axis: "applicability", text: "現場の担当者がAIを使いこなせる前提になっているか？" },
                { axis: "uncertainty_low", text: "AIの誤回答によるやり直しリスクは計算されているか？" }
            ]
        },
        {
            text: "面接官「あなたの強みは一言で言うと何ですか？」",
            options: [
                { axis: "definition", text: "一言でまとめると本来の意味やニュアンスが削ぎ落とされる。" },
                { axis: "causality", text: "強みそのものより「なぜそれが強みと言えるか」の背景が重要。" },
                { axis: "population", text: "他者と比較した相対的な強みなのか自分の中での強みなのか。" },
                { axis: "applicability", text: "御社のどんな業務環境でその強みが発揮できるのか。" },
                { axis: "uncertainty_low", text: "抽象的な回答をして誤解されるリスクを避けたい。" }
            ]
        },
        {
            text: "友人「あのカフェ、料理の提供が遅くて最悪だったよ」",
            options: [
                { axis: "definition", text: "「遅い」って具体的に何分待たされたの？" },
                { axis: "causality", text: "混雑していたからなのかスタッフ不足なのか理由は？" },
                { axis: "population", text: "たまたまその時だけ遅かった可能性はない？" },
                { axis: "applicability", text: "自分が空いている時間に行っても同じ状態になるか？" },
                { axis: "uncertainty_low", text: "自分が行って嫌な思いをするリスクは避けたい。" }
            ]
        },
        {
            text: "上司「この件、臨機応変に対応しておいて」",
            options: [
                { axis: "definition", text: "「臨機応変」の許容範囲や限界ルールを教えてほしい。" },
                { axis: "causality", text: "どのような判断基準で分岐させればいいのか論理が知りたい。" },
                { axis: "population", text: "他のメンバーはどういう対応をしているのか？" },
                { axis: "applicability", text: "前回の似た事例の対応を今回も適用して良いか？" },
                { axis: "uncertainty_low", text: "自分の判断で失敗した時のリスクが大きすぎる。" }
            ]
        },
        {
            text: "SNS投稿「口コミ☆4.8の大人気ホテルに泊まりました！最高でした！」",
            options: [
                { axis: "definition", text: "「最高」って具体的に部屋？接客？立地？" },
                { axis: "causality", text: "なぜそこまで評価が高いのか客観的な理由が知りたい。" },
                { axis: "population", text: "評価件数は何件？サクラの口コミは含まれてない？" },
                { axis: "applicability", text: "自分の旅の目的（ビジネス/観光）にも合うか？" },
                { axis: "uncertainty_low", text: "写真と実際のギャップで後悔したくない。" }
            ]
        },
        {
            text: "先輩「とにかく量をこなせば、後から質はついてくるよ」",
            options: [
                { axis: "definition", text: "どれくらいの「量」をやれば「質」に転化するの？" },
                { axis: "causality", text: "量から質へ変化する論理的なメカニズムは何？" },
                { axis: "population", text: "量をこなしても質が上がらなかった人の割合は？" },
                { axis: "applicability", text: "頭を使わない単純作業にもその法則は当てはまる？" },
                { axis: "uncertainty_low", text: "無駄な努力に終わるリスクや体調を壊す危険は？" }
            ]
        },
        {
            text: "プレゼンター「我が社のサービスを使えば、顧客満足度が大幅にアップします」",
            options: [
                { axis: "definition", text: "「大幅」とは具体的に何%アップを指しているのか。" },
                { axis: "causality", text: "サービス導入と満足度向上を結ぶ因果の証明は？" },
                { axis: "population", text: "導入した全企業のうち、アップした企業は何%？" },
                { axis: "applicability", text: "我が社のような規模や業界でも効果が出るか？" },
                { axis: "uncertainty_low", text: "効果が出なかった場合の保証やリスクヘッジはあるか。" }
            ]
        },
        {
            text: "ニュース「AIの台頭により、10年後に人の仕事の半分がなくなる」",
            options: [
                { axis: "definition", text: "「仕事がなくなる」とは職種消滅のこと？作業の自動化？" },
                { axis: "causality", text: "どのような技術的・経済的メカニズムで代替されるのか。" },
                { axis: "population", text: "調査対象となった職種や国の母集団の偏りは？" },
                { axis: "applicability", text: "自分が就いている具体的な業務にも当てはまるか？" },
                { axis: "uncertainty_low", text: "自分の将来の雇用リスクに対してどう備えれば良いのか。" }
            ]
        },
        {
            text: "同僚「このプロジェクト、絶対に上手くいく気がする！」",
            options: [
                { axis: "definition", text: "何をもって「プロジェクトの成功（上手くいく）」とするか。" },
                { axis: "causality", text: "「気がする」ではなく根拠や根回しの筋道はあるのか。" },

    const profiles = {
        definition: {
            title: "【定義感度・厳密派】言語定義の魔術師",
            strength: "言葉のニュアンスや前提の曖昧さを絶対に見逃さない「要件定義の天才」です。契約書の確認、マニュアル作成、議論の整理で抜群の精度を発揮します。",
            trap: "会議で「その言葉ってどういう意味？」と確認しすぎて、場のテンポを止めてしまったり、相手に「詰められている」と警戒させることがあります。",
            prescription: "相手が口頭で感覚的に話している時はその場で即座に突っ込まず、後から「箇条書きのテキスト」にして確認を入れると無用な摩擦を防げます。",
            environment: "法務、システム要件定義、品質管理、契約交渉、学術・リサーチ分野"
        },
        causality: {
            title: "【因果接続・論理派】仕組みと筋道の探求者",
            strength: "「なぜそうなるのか」という論理的メカニズムを見抜く力に長けています。トラブルの根本原因究明や構造改革で圧倒的な強みを発揮します。",
            trap: "直感や感情で動く相手に対して「理屈が通っていない」と切り捨ててしまい、感情的な対立を生んでしまうことがあります。",
            prescription: "正しい理屈であっても人間は感情で動く生き物だと割り切り、「ロジック7割：感情への配慮3割」を意識すると説得力が跳ね上がります。",
            environment: "業務改善コンサルタント、エンジニア、プロダクトマネージャー、戦略立案"
        },
        population: {
            title: "【母集団・客観派】データと全体像の鑑定士",
            strength: "「それって何例中の話？」と常にサンプル数や全体像を疑うことができ、偏った意見や噂話に騙されない圧倒的な客観性を持っています。",
            trap: "相手が熱量を持って話す「個人的な熱い体験談」に対して、「でもそれって単なる一例ですよね」と冷静に水を差してしまうことがあります。",
            prescription: "「客観的な事実」と「個人の熱量」を切り分け、共感を示す場面ではあえてデータの突っ込みを封印する使い分けが有効です。",
            environment: "データアナリスト、マーチャンダイザー、リスク管理、市場調査・マーケティング"
        },
        applicability: {
            title: "【適用可能性・境界派】再現性と検証のプロ",
            strength: "「うちの環境でも再現できるか？」と境界条件を見抜く目を持っています。成功事例をそのまま鵜呑みにせず、現場に合わせて最適化するのが得意です。",
            trap: "アイデアが出た時に「うちの環境だとここが無理」と条件の壁を先に提示しすぎて、周囲から「否定から入る人」と思われるリスクがあります。",
            prescription: "「無理な理由」を提示した後は、必ず「こう条件を組み替えればうちでも通用する」という代替案をセットで提示しましょう。",
            environment: "業務ローカライズ、新規事業の実現性検証（PoC）、運用構築、現場監督"
        },
        uncertainty_low: {
            title: "【不確実性回避・堅実派】リスクゼロの守護神",
            strength: "曖昧さや不確定要素を徹底的に排除し、計画の細部まで詰める「圧倒的な確実性」を作れます。漏れのない進行管理でチームに安心感を与えます。",
            trap: "予測不能な変化やアジャイルな進行に対してストレスを感じやすく、答えのない状態に直面すると足が止まってしまうことがあります。",
            prescription: "「不確定な状態も計画の一部」と割り切り、あらかじめ「想定外が起きた時の遊び（バッファ）」を3割確保する癖をつけましょう。",
            environment: "プロジェクトマネジメント（PMO）、経理・財務、安全管理、イベント進行管理"
        }
    };

    let currentQuestionIndex = 0;
    let scores = {
        definition: 0,
        causality: 0,
        population: 0,
        applicability: 0,
        uncertainty_low: 0
    };

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    let radarChartInstance = null;

    // 配列のシャッフル関数（選択肢の位置によるバイアスを排除）
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        currentQuestionIndex = 0;
        scores = { definition: 0, causality: 0, population: 0, applicability: 0, uncertainty_low: 0 };
        quizScreen.classList.remove("hidden");
        resultScreen.classList.add("hidden");
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        questionText.textContent = `Q${currentQuestionIndex + 1}. ${q.text}`;
        
        progressText.textContent = `Q${currentQuestionIndex + 1} / ${questions.length}`;
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

        optionsContainer.innerHTML = "";
        
        // 選択肢の並び順をランダム化
        const shuffledOptions = shuffleArray(q.options);

        shuffledOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt.text;
            btn.onclick = () => selectOption(opt.axis);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(axis) {
        if (axis && scores.hasOwnProperty(axis)) {
            scores[axis]++;
        }
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");

        // 最高スコアの軸を判定
        let maxAxis = "definition";
        let maxScore = -1;
        for (const axis in scores) {
            if (scores[axis] > maxScore) {
                maxScore = scores[axis];
                maxAxis = axis;
            }
        }

        // 取扱説明書の描画
        const profile = profiles[maxAxis];
        document.getElementById("type-title").textContent = profile.title;
        document.getElementById("type-strength").textContent = profile.strength;
        document.getElementById("type-trap").textContent = profile.trap;
        document.getElementById("type-prescription").textContent = profile.prescription;
        document.getElementById("type-environment").textContent = profile.environment;

        // チャートの描画
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (radarChartInstance) {
            radarChartInstance.destroy();
        }

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['定義感度', '因果接続', '母集団意識', '適用可能性', '不確実性回避'],
                datasets: [{
                    label: '思考の引っかかり感度（出現回数）',
                    data: [
                        scores.definition,
                        scores.causality,
                        scores.population,
                        scores.applicability,
                        scores.uncertainty_low
                    ],
                    backgroundColor: 'rgba(79, 70, 229, 0.2)',
                    borderColor: 'rgba(79, 70, 229, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(79, 70, 229, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        pointLabels: {
                            font: { size: 12, weight: 'bold' },
                            color: '#1e293b'
                        },
                        suggestedMin: 0,
                        suggestedMax: 15,
                        ticks: { stepSize: 3 }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function restartQuiz() {
        initQuiz();
    }

    // 診断スタート
    initQuiz();
</script>
</body>
</html>
