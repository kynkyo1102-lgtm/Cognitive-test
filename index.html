<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたの頭は、何に引っかかる？ | 認知癖診断 v0.4</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-align: right;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .question-category {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            background-color: #eef2ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        .option-score-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        /* 結果画面 */
        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .result-subtitle {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 32px auto;
        }

        /* 取扱説明書カード */
        .instruction-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .instruction-header {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-box {
            margin-bottom: 16px;
        }

        .section-box:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-content {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
            margin: 0;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            margin-top: 16px;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="quiz-screen">
        <div class="progress-container">
            <div class="progress-text" id="progress-text">Q1 / 25</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
        <div class="question-title" id="question-text">質問文がここに表示されます</div>
        <div class="options-container" id="options-container">
            <!-- 5つの選択肢ボタンが動的に挿入されます -->
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title">あなたの認知癖・思考傾向</div>
        <div class="result-subtitle">5軸スコア（各5〜25点） ＆ あなたの取扱説明書</div>
        
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="instruction-card">
            <div class="instruction-header" id="type-title">あなたのメイン思考タイプ</div>
            
            <div class="section-box">
                <div class="section-title">💪 強み・発揮できる才能</div>
                <p class="section-content" id="type-strength"></p>
            </div>

            <div class="section-box">
                <div class="section-title">⚠️️ 陥りがちな罠・コミュニケーションの摩擦</div>
                <p class="section-content" id="type-trap"></p>
            </div>

            <div class="section-box">
                <div class="section-title">💡 トラブルを防ぐ処方箋・活用術</div>
                <p class="section-content" id="type-prescription"></p>
            </div>

            <div class="section-box">
                <div class="section-title">🚀 輝く環境・向いているポジション</div>
                <p class="section-content" id="type-environment"></p>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 5段階評価の汎用選択肢
    const standardScale = [
        { text: "非常に当てはまる（強く引っかかる）", score: 5 },
        { text: "やや当てはまる", score: 4 },
        { text: "どちらともいえない", score: 3 },
        { text: "あまり当てはまらない", score: 2 },
        { text: "全く当てはまらない（気にならない）", score: 1 }
    ];

    // 各軸5問 × 5軸 ＝ 全25問（5択化により問題数を精鋭化してテンポも維持）
    const questions = [
        // --- 1. 定義感度 (definition) ---
        { axis: "definition", text: "「みんな賛成している」「普通はこうする」と言われると、まず『みんな』や『普通』の定義・範囲が気になる。" },
        { axis: "definition", text: "指示や会話の中に「いい感じに」「要領よく」「コスパよく」といった曖昧な言葉があると、具体化しないと気が済まない。" },
        { axis: "definition", text: "仕事や議論を進める際、最初に「言葉の定義」や「ルールの境界線」を明確にすることを重視する。" },
        { axis: "definition", text: "「自己責任」や「自由」など、人によって捉え方がズレそうな抽象的単語を聞くと違和感を覚える。" },
        { axis: "definition", text: "会議で意見が食い違っている時、原因は「考えの違い」ではなく「言葉の定義のズレ」だと感じることが多い。" },

        // --- 2. 因果接続 (causality) ---
        { axis: "causality", text: "「これをすれば絶対に上手くいく」という主張に対して、なぜそうなるのか論理的な仕組み（メカニズム）を追求したくなる。" },
        { axis: "causality", text: "トラブルが起きた時、精神論や状況説明よりも「どの事象が引き金（トリガー）になったか」の因果関係を真っ先に解明したい。" },
        { axis: "causality", text: "占い、ジンクス、スピリチュアルなど、科学的・論理的な因果関係がないものを信用しにくい。" },
        { axis: "causality", text: "他人の主張を聞く時、結論と理由の間に「論理の飛躍」がないかを無意識にチェックしてしまう。" },
        { axis: "causality", text: "アドバイスをもらうなら、「具体的に何をすればいいか」よりも「なぜそうすべきなのか」の理屈に納得したい。" },

        // --- 3. 母集団・サンプル意識 (population) ---
        { axis: "population", text: "「満足度90%」「みんな使っている」などの謳い文句を見ると、「何人中何人のデータ？」とサンプル数を疑う。" },
        { axis: "population", text: "SNSで極端な意見がバズっている時、「声が大きい一部の層だけではないか」と全体像を俯瞰しようとする。" },
        { axis: "population", text: "自分の経験談を話す時、「これはあくまで私個人の1例だけど」と前置きを入れる癖がある。" },
        { axis: "population", text: "1〜2件の極端な口コミや体験談（N=1）だけで、全体の良し悪しを判断されると強い違和感を覚える。" },
        { axis: "population", text: "何かを評価・判断する時は、感覚や1人の意見よりも、統計データや全体の傾向（分布）を重視する。" },

        // --- 4. 適用可能性・再現性 (applicability) ---
        { axis: "applicability", text: "他社の成功事例や有名人のノウハウを聞いた時、「その前提条件は自分たちの環境にも当てはまるか？」と考える。" },
        { axis: "applicability", text: "マニュアルやルールを作る時、例外や別のシチュエーションでも通用する汎用性を持たせようとする。" },
        { axis: "applicability", text: "ノウハウを学ぶ時は、単にやり方を真似るのではなく「どんな条件なら使えて、どこからは使えないか（限界）」を把握したい。" },
        { axis: "applicability", text: "「過去にこれで成功したから」という理由だけで、環境が異なる現在にも同じ手法を適用することに慎重である。" },
        { axis: "applicability", text: "素晴らしいアイデアが出ても、「で、実際の現場の制約の中でどう実装・運用するの？」と実現可能性を気にする。" },

        // --- 5. 不確実性回避 (uncertainty_low) ---
        { axis: "uncertainty_low", text: "計画や仕様が曖昧なまま「とりあえず走り出しながら考えよう」と言われると、強い不安やストレスを感じる。" },
        { axis: "uncertainty_low", text: "旅行やイベントの時、移動手段やスケジュールをあらかじめ細かく決めておきたいタイプだ。" },
        { axis: "uncertainty_low", text: "正解や終わりの見えない抽象的な議論を延々と続けるより、早く着地点や1つの決定を出してすっきりさせたい。" },
        { axis: "uncertainty_low", text: "予測不能なリスクやグレーゾーンを残すくらいなら、多少時間がかかってもルールや計画をガチガチに固めたい。" },
        { axis: "uncertainty_low", text: "レストランや買い物では、味や品質が読めない新商品より、知っている無難・確実な選択肢を選びがちだ。" }
    ];

    // プロファイルデータ
    const profiles = {
        definition: {
            title: "【定義感度・厳密派】言語定義の魔術師",
            strength: "言葉のニュアンスや前提の曖昧さを絶対に見逃さない「要件定義の天才」です。契約書の確認、マニュアル作成、議論の整理で抜群の精度を発揮します。",
            trap: "会議で「その言葉ってどういう意味？」と確認しすぎて、場のテンポを止めてしまったり、相手に「詰められている」と警戒させることがあります。",
            prescription: "相手が口頭で感覚的に話している時はその場で即座に突っ込まず、後から「箇条書きのテキスト」にして確認を入れると無用な摩擦を防げます。",
            environment: "法務、システム要件定義、品質管理、契約交渉、学術・リサーチ分野"
        },
        causality: {
            title: "【因果接続・論理派】仕組みと筋道の探求者",
            strength: "「なぜそうなるのか」という論理的メカニズムを見抜く力に長けています。トラブルの根本原因究明や構造改革で圧倒的な強みを発揮します。",
            trap: "直感や感情で動く相手に対して「理屈が通っていない」と切り捨ててしまい、感情的な対立を生んでしまうことがあります。",
            prescription: "正しい理屈であっても人間は感情で動く生き物だと割り切り、「ロジック7割：感情への配慮3割」を意識すると説得力が跳ね上がります。",
            environment: "業務改善コンサルタント、エンジニア、プロダクトマネージャー、戦略立案"
        },
        population: {
            title: "【母集団・客観派】データと全体像の鑑定士",
            strength: "「それって何例中の話？」と常にサンプル数や全体像を疑うことができ、偏った意見や噂話に騙されない圧倒的な客観性を持っています。",
            trap: "相手が熱量を持って話す「個人的な熱い体験談」に対して、「でもそれって単なる一例ですよね」と冷静に水を差してしまうことがあります。",
            prescription: "「客観的な事実」と「個人の熱量」を切り分け、共感を示す場面ではあえてデータの突っ込みを封印する使い分けが有効です。",
            environment: "データアナリスト、マーチャンダイザー、リスク管理、市場調査・マーケティング"
        },
        applicability: {
            title: "【適用可能性・境界派】再現性と検証のプロ",
            strength: "「うちの環境でも再現できるか？」と境界条件を見抜く目を持っています。成功事例をそのまま鵜呑みにせず、現場に合わせて最適化するのが得意です。",
            trap: "アイデアが出た時に「うちの環境だとここが無理」と条件の壁を先に提示しすぎて、周囲から「否定から入る人」と思われるリスクがあります。",
            prescription: "「無理な理由」を提示した後は、必ず「こう条件を組み替えればうちでも通用する」という代替案をセットで提示しましょう。",
            environment: "業務ローカライズ、新規事業の実現性検証（PoC）、運用構築、現場監督"
        },
        uncertainty_low: {
            title: "【不確実性回避・堅実派】リスクゼロの守護神",
            strength: "曖昧さや不確定要素を徹底的に排除し、計画の細部まで詰める「圧倒的な確実性」を作れます。漏れのない進行管理でチームに安心感を与えます。",
            trap: "予測不能な変化やアジャイルな進行に対してストレスを感じやすく、答えのない状態に直面すると足が止まってしまうことがあります。",
            prescription: "「不確定な状態も計画の一部」と割り切り、あらかじめ「想定外が起きた時の遊び（バッファ）」を3割確保する癖をつけましょう。",
            environment: "プロジェクトマネジメント（PMO）、経理・財務、安全管理、イベント進行管理"
        }
    };

    let currentQuestionIndex = 0;
    let scores = {
        definition: 0,
        causality: 0,
        population: 0,
        applicability: 0,
        uncertainty_low: 0
    };

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    let radarChartInstance = null;

    function initQuiz() {
        currentQuestionIndex = 0;
        scores = { definition: 0, causality: 0, population: 0, applicability: 0, uncertainty_low: 0 };
        quizScreen.classList.remove("hidden");
        resultScreen.classList.add("hidden");
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        questionText.textContent = `Q${currentQuestionIndex + 1}. ${q.text}`;
        
        progressText.textContent = `Q${currentQuestionIndex + 1} / ${questions.length}`;
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

        optionsContainer.innerHTML = "";
        
        // 5つの選択肢を生成
        standardScale.forEach(scale => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `
                <span>${scale.text}</span>
            `;
            btn.onclick = () => selectOption(q.axis, scale.score);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(axis, score) {
        if (axis && scores.hasOwnProperty(axis)) {
            scores[axis] += score;
        }
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");

        // 最高スコアの軸を判定
        let maxAxis = "definition";
        let maxScore = -1;
        for (const axis in scores) {
            if (scores[axis] > maxScore) {
                maxScore = scores[axis];
                maxAxis = axis;
            }
        }

        // 取扱説明書の描画
        const profile = profiles[maxAxis];
        document.getElementById("type-title").textContent = profile.title;
        document.getElementById("type-strength").textContent = profile.strength;
        document.getElementById("type-trap").textContent = profile.trap;
        document.getElementById("type-prescription").textContent = profile.prescription;
        document.getElementById("type-environment").textContent = profile.environment;

        // チャートの描画
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (radarChartInstance) {
            radarChartInstance.destroy();
        }

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['定義感度', '因果接続', '母集団意識', '適用可能性', '不確実性回避'],
                datasets: [{
                    label: '思考癖スコア',
                    data: [
                        scores.definition,
                        scores.causality,
                        scores.population,
                        scores.applicability,
                        scores.uncertainty_low
                    ],
                    backgroundColor: 'rgba(79, 70, 229, 0.2)',
                    borderColor: 'rgba(79, 70, 229, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(79, 70, 229, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        pointLabels: {
                            font: { size: 12, weight: 'bold' },
                            color: '#1e293b'
                        },
                        suggestedMin: 5,
                        suggestedMax: 25,
                        ticks: { stepSize: 5 }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function restartQuiz() {
        initQuiz();
    }

    // 診断スタート
    initQuiz();
</script>
</body>
</html>
