<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 30問でわかる情報処理プロファイル</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #2563eb;
            --accent-light: #eff6ff;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-align: right;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .category-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            background-color: var(--accent-light);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        /* 結果画面 */
        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 4px;
        }

        .result-subtitle {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto 20px auto;
        }

        /* 形状タイプタグ（突出型/複合型/中間型） */
        .shape-tag {
            text-align: center;
            margin-bottom: 20px;
        }

        .shape-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            background-color: #f1f5f9;
            color: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
        }

        /* プロファイルカード */
        .instruction-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .main-style-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .instruction-header {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .style-summary {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: pre-wrap;
        }

        .section-box {
            margin-bottom: 18px;
        }

        .section-box:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .section-content {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="quiz-screen">
        <div class="progress-container">
            <div class="progress-text" id="progress-text">Q1 / 30</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
        <div class="category-badge" id="category-badge">テーマ：情報の受け取り方</div>
        <div class="question-title" id="question-text"></div>
        <div class="options-container" id="options-container"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title">認知プロファイル</div>
        <div class="result-subtitle">回答から抽出された情報処理パターンと取扱説明書</div>
        
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="shape-tag">
            <span class="shape-badge" id="shape-badge">処理パターン分布：中間型</span>
        </div>

        <div class="instruction-card">
            <div class="main-style-tag">組み合わせパターン</div>
            <div class="instruction-header" id="type-title"></div>
            <p class="style-summary" id="type-summary"></p>
            
            <div class="section-box">
                <div class="section-title">📌 出やすい処理</div>
                <p class="section-content" id="type-tendency"></p>
            </div>

            <div class="section-box">
                <div class="section-title">⚠ 負荷がかかりやすい場面（認知コスト高）</div>
                <p class="section-content" id="type-cost"></p>
            </div>

            <div class="section-box">
                <div class="section-title">💡 このプロファイルの取扱説明書</div>
                <p class="section-content" id="type-guide"></p>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 6軸の定義
    // Structure: 構造化（全体像・分類・フレームワーク）
    // Analysis : 条件・検証（前提・例外・論理的整合性）
    // Context  : 文脈読解（背景・意図・人間関係・ニュアンス）
    // Hold     : 保留・慎重（判断保留・観察・不確実性の容認）
    // Explore  : 具体・参照（具体例・事例・観察からの抽象化） ← 「行動派」から「具体→抽象」の認知に修正
    // Compress : 要約・圧縮（核心化・優先順位・結論優先）

    const styleNames = {
        Structure: "構造化",
        Analysis: "条件・検証",
        Context: "文脈読解",
        Hold: "保留・慎重",
        Explore: "具体・参照",
        Compress: "要約・圧縮"
    };

    // 質問データ (30問)
    const questions = [
        // Ⅰ. 情報の受け取り方
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "ある出来事について、AさんとBさんの説明が食い違っています。あなたなら？",
            options: [
                { text: "A. どちらか一方の説明をひとまず採用する", weights: { Compress: 2, Explore: 1 } },
                { text: "B. 両方の話を聞いて共通点を探す", weights: { Structure: 2, Analysis: 1 } },
                { text: "C. 情報が足りないので判断を保留する", weights: { Hold: 2, Analysis: 1 } },
                { text: "D. なぜ説明が食い違ったのか背景を考える", weights: { Context: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "長い文章を読むとき、あなたは？",
            options: [
                { text: "A. 具体的な事例が書かれている部分から読む", weights: { Explore: 2, Context: 1 } },
                { text: "B. まず結論や全体の要点を探す", weights: { Compress: 2, Analysis: 1 } },
                { text: "C. 前提や根拠が書かれている部分を確認する", weights: { Analysis: 2, Structure: 1 } },
                { text: "D. 全体の構造（目次や章立て）を把握してから読む", weights: { Structure: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "初めて聞く専門用語がたくさん出てくる説明を聞くとき、",
            options: [
                { text: "A. 身近な具体例に置き換えて理解しようとする", weights: { Explore: 2, Context: 1 } },
                { text: "B. その言葉の厳密な定義や条件を調べる", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 話全体の文脈から大体の意味を推測する", weights: { Context: 2, Hold: 1 } },
                { text: "D. 細部を無視して「結局どういうことか」を掴む", weights: { Compress: 2, Structure: 1 } }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "「最近こういう人が増えた」と言われたとき、",
            options: [
                { text: "A. 身の回りの具体事例を思い浮かべて当てはまるか試す", weights: { Explore: 2, Context: 1 } },
                { text: "B. 何をもって「増えた」と言えるのか条件や根拠が気になる", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. その発言をした人の立場や背景を察する", weights: { Context: 2, Hold: 1 } },
                { text: "D. 断定するにはデータが足りないと考える", weights: { Hold: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "説明を聞いていて「なんとなく不自然だな」と感じたとき、",
            options: [
                { text: "A. 過去の似た事例や具体例と照らし合わせる", weights: { Explore: 2, Context: 1 } },
                { text: "B. 論理的な飛躍や前提の矛盾を探す", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 全体像のどこに位置づく話なのか確認する", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 違和感の原因がわかるまで決めつけずに保留する", weights: { Hold: 2, Analysis: 1 } }
            ]
        },

        // Ⅱ. 推論・問題の組み立て方
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "ある方法を試したら、予想と違う結果になりました。",
            options: [
                { text: "A. 他の類似事例ではどうなっているか調べる", weights: { Explore: 2, Context: 1 } },
                { text: "B. どの条件や前提がズレていたのか検証する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 全体のプロセスのうち、どこに位置する問題か整理する", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 一時的な例外の可能性も考慮して経過を見る", weights: { Hold: 2, Context: 1 } }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "複雑な問題を解くことになったとき、まず行うのは？",
            options: [
                { text: "A. 似た問題の具体的成功例や参照ケースを探す", weights: { Explore: 2, Context: 1 } },
                { text: "B. 問題を成立させている前提や変数を分解する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 問題の全体構造や要素間の関係図を描く", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 最も影響の大きい核心部分だけに絞り込む", weights: { Compress: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "「この方法なら確実です」と提案されたとき、",
            options: [
                { text: "A. どのような具体事例で成果が出たのか確認する", weights: { Explore: 2, Context: 1 } },
                { text: "B. どういう条件・環境なら成立するのかを確認する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. その方法が全体計画のどこに適用されるか確認する", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 「絶対」を過信せず例外の可能性を保留しておく", weights: { Hold: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "「Aが起きた後にBが起きた」という報告を受けたとき、",
            options: [
                { text: "A. 他にも同様のパターンが起きている事例を探す", weights: { Explore: 2, Context: 1 } },
                { text: "B. 因果関係があるのか、単なる偶然（相関）か検証する", weights: { Analysis: 2, Hold: 1 } },
                { text: "C. 2つの出来事を結ぶ全体の構造を見る", weights: { Structure: 2, Analysis: 1 } },
                { text: "D. 当事者の意図や背景文脈を確認する", weights: { Context: 2, Hold: 1 } }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "問題の解決策を評価するとき、一番重視するポイントは？",
            options: [
                { text: "A. 具体的で参照しやすいモデルがあるか", weights: { Explore: 2, Context: 1 } },
                { text: "B. 前提条件や論理的根拠がしっかりしているか", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. システム全体との整合性が取れているか", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 結論として最もインパクトがあるか", weights: { Compress: 2, Analysis: 1 } }
            ]
        },

        // Ⅲ. 不確実さとの付き合い方
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "情報が不足している中で判断を迫られたとき、",
            options: [
                { text: "A. 類似の具体ケースを参考に判断する", weights: { Explore: 2, Context: 1 } },
                { text: "B. 最低限クリアすべき条件やリスクを整理する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 不確実であることを前提として判断を保留・静観する", weights: { Hold: 2, Analysis: 1 } },
                { text: "D. 一番大事な軸だけに絞って割り切る", weights: { Compress: 2, Explore: 1 } }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "真偽が不明な情報に遭遇したとき、",
            options: [
                { text: "A. 一旦判断を棚上げし、そのまま観察を続ける", weights: { Hold: 2, Context: 1 } },
                { text: "B. 仮に本当だとした場合の論理的影響を分析する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 他の類似情報や具体的ソースを参照してみる", weights: { Explore: 2, Context: 1 } },
                { text: "D. 自分にとって関係のあるポイントだけ抽出する", weights: { Compress: 2, Context: 1 } }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "自分の予測と現実のデータが食い違ったとき、",
            options: [
                { text: "A. 予測のどの前提・条件が誤っていたか考える", weights: { Analysis: 2, Structure: 1 } },
                { text: "B. 現実の具体例を詳しく観察して学び直す", weights: { Explore: 2, Context: 1 } },
                { text: "C. 予測モデル全体の構造を修正する", weights: { Structure: 2, Analysis: 1 } },
                { text: "D. 状況が変化するまで判断を保留する", weights: { Hold: 2, Context: 1 } }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "専門家の意見が二つに分かれている話題について、",
            options: [
                { text: "A. 両者が置かれている背景や文脈の違いを見る", weights: { Context: 2, Analysis: 1 } },
                { text: "B. それぞれの主張が基づく前提と条件を比較する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. まだ決着がついていない問題として保留する", weights: { Hold: 2, Analysis: 1 } },
                { text: "D. 具体的な実例で成果を出している方を参考にする", weights: { Explore: 2, Compress: 1 } }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "「現時点では分からない」と表明することに対する感覚は？",
            options: [
                { text: "A. 適切な条件が揃っていないなら当然の反応だと思う", weights: { Analysis: 1, Hold: 2 } },
                { text: "B. 分からないまま問いを保持し続けるのは自然なことだ", weights: { Hold: 2, Context: 1 } },
                { text: "C. 具体的ケースを集めればいずれ見えてくると思う", weights: { Explore: 2, Structure: 1 } },
                { text: "D. できれば要点を絞って仮の結論を出したい", weights: { Compress: 2, Structure: 1 } }
            ]
        },

        // Ⅳ. 自分の認知を見る
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分の意見と真っ向から対立する考えに触れたとき、",
            options: [
                { text: "A. なぜ相手がそう考えるに至ったか背景を理解しようとする", weights: { Context: 2, Analysis: 1 } },
                { text: "B. 相手のロジックの前提条件を確認する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 相手が挙げている具体的根拠や事例を見る", weights: { Explore: 2, Context: 1 } },
                { text: "D. 自分の意見の要点とどこが対立しているか比較する", weights: { Structure: 1, Compress: 2 } }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分の考えに対して「視野が狭い」と指摘されたら？",
            options: [
                { text: "A. 具体的になどのケースが見落とされているか聞く", weights: { Explore: 2, Analysis: 1 } },
                { text: "B. どの前提や条件を見落としていたか分析する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 指摘した人の視点や背景を理解しようとする", weights: { Context: 2, Hold: 1 } },
                { text: "D. 自分の思考フレームワーク自体を再構築する", weights: { Structure: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分の過去の判断が間違っていたと気づいたとき、",
            options: [
                { text: "A. 状況の変化に合わせて即座に認識を更新する", weights: { Compress: 1, Explore: 2 } },
                { text: "B. 何が要因で読み違えたのか条件を検証する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 当時の状況や限られた文脈では仕方なかったと捉える", weights: { Context: 2, Hold: 1 } },
                { text: "D. 次回同じ間違いを防ぐ分類ルールを作る", weights: { Structure: 2, Analysis: 1 } }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分の好みや価値観について考えるとき、",
            options: [
                { text: "A. 自分の過去の体験や具体的エピソードを振り返る", weights: { Explore: 2, Context: 1 } },
                { text: "B. なぜそれが好きなのか共通する要素を特定する", weights: { Analysis: 2, Structure: 1 } },
                { text: "C. 価値観の全体像や体系の中に位置づける", weights: { Structure: 2, Compress: 1 } },
                { text: "D. 複雑に考えず「一言で言えば何か」を定義する", weights: { Compress: 2, Structure: 1 } }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "「自分はこういう人間だ」という自己像について、",

        currentQuestionIndex = 0;
        scores = { Structure: 0, Analysis: 0, Context: 0, Hold: 0, Explore: 0, Compress: 0 };
        quizScreen.classList.remove("hidden");
        resultScreen.classList.add("hidden");
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        categoryBadge.textContent = `テーマ：${q.category.replace(/^[ⅠⅡⅢⅣⅤⅥ]\.\s*/, '')}`;
        questionText.textContent = `Q${currentQuestionIndex + 1}. ${q.text}`;
        
        progressText.textContent = `Q${currentQuestionIndex + 1} / ${questions.length}`;
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

        optionsContainer.innerHTML = "";
        
        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt.text;
            btn.onclick = () => selectOption(opt.weights);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(weights) {
        for (const style in weights) {
            if (scores.hasOwnProperty(style)) {
                scores[style] += weights[style];
            }
        }
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    // 分布パターン（突出型/複合型/中間型）の計算
    function calculateDistributionShape(scoreValues) {
        const mean = scoreValues.reduce((a, b) => a + b, 0) / scoreValues.length;
        const variance = scoreValues.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / scoreValues.length;
        const stdDev = Math.sqrt(variance);

        if (stdDev > 4.2) {
            return {
                label: "処理パターン分布：突出型（特定の処理にかなり偏るスタイル）",
                desc: "特定の情報処理にかなり依存しやすい尖ったプロファイルです。自分の得意な土俵に持ち込むと圧倒的なパフォーマンスを発揮します。"
            };
        } else if (stdDev < 2.5) {
            return {
                label: "処理パターン分布：複合型（複数の処理をバランスよく併用するスタイル）",
                desc: "状況に応じて複数の情報処理を柔軟に切り替えて使うバランス型です。環境変化への適応力が高いプロファイルです。"
            };
        } else {
            return {
                label: "処理パターン分布：中間型（上位の傾向が適度に明確なスタイル）",
                desc: "主軸となる傾向を持ちつつも、状況に応じて副次的な処理もスムーズに取り入れられる扱いやすいプロファイルです。"
            };
        }
    }

    function showResult() {
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");

        // スコア順にソート
        const sortedStyles = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
        const top1 = sortedStyles[0];
        const top2 = sortedStyles[1];

        // 形状判定（標準偏差）
        const scoreValues = Object.values(scores);
        const shapeInfo = calculateDistributionShape(scoreValues);
        document.getElementById("shape-badge").textContent = shapeInfo.label;

        // プロファイルデータの参照（Matrixにない組み合わせの場合は相互参照で生成）
        const pairKey1 = `${top1}_${top2}`;
        const pairKey2 = `${top2}_${top1}`;
        let profile = profileMatrix[pairKey1] || profileMatrix[pairKey2];

        if (!profile) {
            // フォールバック用の一体化テキスト生成
            profile = {
                title: `${styleNames[top1]} × ${styleNames[top2]}`,
                summary: `情報を捉える際、【${styleNames[top1]}】の処理を主軸としながら、【${styleNames[top2]}】の処理も組み合わせて思考を整理する傾向があります。`,
                tendency: `・【${styleNames[top1]}】に関する処理が優先的に出現する\n・補助的に【${styleNames[top2]}】のアプローチで保管する`,
                cost: "・どちらの処理パターンも適用しにくい曖昧な環境での意思決定",
                guide: "主軸の処理をベースにしつつ、状況に応じて副次的な視点を取り入れることでスムーズに認知コストを下げられます。"
            };
        }

        // 画面へのセット
        document.getElementById("type-title").textContent = profile.title;
        document.getElementById("type-summary").textContent = profile.summary;
        document.getElementById("type-tendency").textContent = profile.tendency;
        document.getElementById("type-cost").textContent = profile.cost;
        document.getElementById("type-guide").textContent = profile.guide;

        // レーダーチャートの描画
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (radarChartInstance) {
            radarChartInstance.destroy();
        }

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [
                    styleNames.Structure,
                    styleNames.Analysis,
                    styleNames.Context,
                    styleNames.Hold,
                    styleNames.Explore,
                    styleNames.Compress
                ],
                datasets: [{
                    label: '選びやすかった処理パターン',
                    data: [
                        scores.Structure,
                        scores.Analysis,
                        scores.Context,
                        scores.Hold,
                        scores.Explore,
                        scores.Compress
                    ],
                    backgroundColor: 'rgba(37, 99, 235, 0.15)',
                    borderColor: 'rgba(37, 99, 235, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(37, 99, 235, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        pointLabels: {
                            font: { size: 12, weight: 'bold' },
                            color: '#0f172a'
                        },
                        suggestedMin: 0,
                        ticks: { display: false } // 目盛り数値はあえて非表示（絶対的な能力値ではないため）
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function restartQuiz() {
        initQuiz();
    }

    // 診断スタート
    initQuiz();
</script>
</body>
