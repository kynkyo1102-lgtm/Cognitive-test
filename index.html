<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 30問でわかる情報処理プロファイル</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-main);
            text-align: center;
        }

        p.description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 24px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* 質問画面 */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .option-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* 結果画面 */
        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .result-subtitle {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .result-distribution-tag {
            display: inline-block;
            background-color: #eff6ff;
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid #bfdbfe;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 24px auto;
        }

        .section-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .section-box ul {
            padding-left: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .section-box li {
            margin-bottom: 4px;
        }

        .note-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 24px;
            line-height: 1.4;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- スタート画面 -->
    <div id="screen-start">
        <h1>認知スタイル診断</h1>
        <p class="description">普段自然に選択しやすい「情報処理のスタイル」を可視化する診断です。（全30問）</p>
        <button class="btn" onclick="startQuiz()">診断を始める</button>
    </div>

    <!-- 質問画面 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="question-number" class="question-number">質問 1 / 30</div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-container"></div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="hidden">
        <div class="result-header">
            <p style="font-size:0.85rem; color:var(--text-sub);">あなたの情報処理プロファイル</p>
            <div id="result-title" class="result-title"></div>
            <div id="result-distribution-tag" class="result-distribution-tag"></div>
            <p id="result-overview" class="description" style="text-align:left;"></p>
        </div>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="section-box">
            <h3>出やすい処理</h3>
            <ul id="list-frequent"></ul>
        </div>

        <div class="section-box">
            <h3>認知コストが上がりやすそうな場面</h3>
            <ul id="list-costs"></ul>
        </div>

        <p class="note-text">※ この診断は個人の情報処理の好みを表すものであり、能力の優劣や適正を特定するものではありません。</p>
        <button class="btn" onclick="resetQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
// ==========================================
// 定義データ
// ==========================================

const AXES = {
    STRUCTURE: 'STRUCTURE', // 構造化
    CONDITION: 'CONDITION', // 条件・検証
    CONTEXT: 'CONTEXT',     // 文脈
    HOLD: 'HOLD',           // 保留
    CONCRETE: 'CONCRETE',   // 具体
    COMPRESS: 'COMPRESS'    // 圧縮
};

const AXIS_NAMES = {
    [AXES.STRUCTURE]: '構造化',
    [AXES.CONDITION]: '条件・検証',
    [AXES.CONTEXT]: '文脈',
    [AXES.HOLD]: '保留',
    [AXES.CONCRETE]: '具体',
    [AXES.COMPRESS]: '圧縮'
};

// 全30問（配点データ）
const QUESTIONS = [
    { text: "新しいプロジェクトを任された時、最初にすることは？", options: [
        { text: "全体の枠組みや構成要素を整理する", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "前提条件や成功基準を確認する", scores: { [AXES.CONDITION]: 2 } },
        { text: "なぜこの企画が必要なのか背景を把握する", scores: { [AXES.CONTEXT]: 2 } },
        { text: "まずは明確な例や具体例を集める", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "説明を受ける時、一番気になるのは？", options: [
        { text: "全体の中でその話がどこに位置するか", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "その主張の根拠や前提が正しいか", scores: { [AXES.CONDITION]: 2 } },
        { text: "話し手がどういう経緯でそう考えているか", scores: { [AXES.CONTEXT]: 2 } },
        { text: "一言で言うと何がポイントなのか", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "情報が不足していて判断できない時、どうする？", options: [
        { text: "判断を一度保留し、保留の理由を整理する", scores: { [AXES.HOLD]: 2 } },
        { text: "足りない前提条件やデータを特定して要求する", scores: { [AXES.CONDITION]: 2 } },
        { text: "手元にある具体例から推測を進める", scores: { [AXES.CONCRETE]: 2 } },
        { text: "全体の流れを見て大枠の方針だけ決める", scores: { [AXES.STRUCTURE]: 1, [AXES.COMPRESS]: 1 } }
    ]},
    { text: "複雑な課題に直面した時、まず行うアプローチは？", options: [
        { text: "要素を分解してロジックツリーのように整理する", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "どのような条件が揃えば解決できるか整理する", scores: { [AXES.CONDITION]: 2 } },
        { text: "これまでの経緯や関係者の意図を確認する", scores: { [AXES.CONTEXT]: 2 } },
        { text: "状況がクリアになるまで拙速な結論を避ける", scores: { [AXES.HOLD]: 2 } }
    ]},
    { text: "文章を書くときに意識することは？", options: [
        { text: "見出しや箇条書きで構造を明確にする", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "論理の飛躍や矛盾がないかチェックする", scores: { [AXES.CONDITION]: 2 } },
        { text: "要約して短い言葉で伝える", scores: { [AXES.COMPRESS]: 2 } },
        { text: "具体的なエピソードや実例を入れる", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "会議で意見が割れた時、どう行動する？", options: [
        { text: "議論の争点を構造化して可視化する", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "それぞれの意見の前提条件を洗い出す", scores: { [AXES.CONDITION]: 2 } },
        { text: "各立場に至った経緯や背景を深掘りする", scores: { [AXES.CONTEXT]: 2 } },
        { text: "すぐに決定せず、一度持ち帰って検討する", scores: { [AXES.HOLD]: 2 } }
    ]},
    { text: "理解しやすいと感じる資料は？", options: [
        { text: "図解やフレームワークで整理されている", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "前提、根拠、結論が明確に示されている", scores: { [AXES.CONDITION]: 2 } },
        { text: "具体例やサンプルのデータが豊富なもの", scores: { [AXES.CONCRETE]: 2 } },
        { text: "1ページで結論が端的にまとまっているもの", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "意見を求められた時、困るのは？", options: [
        { text: "全体像や目的が見えないまま聞かれること", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "前提条件や判断基準が曖昧なこと", scores: { [AXES.CONDITION]: 2 } },
        { text: "背景や経緯を知らされていないこと", scores: { [AXES.CONTEXT]: 2 } },
        { text: "情報が揃っていないのに即答を求められること", scores: { [AXES.HOLD]: 2 } }
    ]},
    { text: "長文のニュースを読むとき、どう読む？", options: [
        { text: "全体の大枠や構成を把握しながら読む", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "事実と解釈、根拠が正しいかを確かめながら読む", scores: { [AXES.CONDITION]: 2 } },
        { text: "その話題に至った歴史や背景を考えながら読む", scores: { [AXES.CONTEXT]: 2 } },
        { text: "要約部分だけを拾い読みする", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "アイデアを考える時、重視することは？", options: [
        { text: "既存の枠組みを整理し直すこと", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "実現可能性や条件を満たしているか確認すること", scores: { [AXES.CONDITION]: 2 } },
        { text: "現実的な具体的なプロトタイプを作ってみること", scores: { [AXES.CONCRETE]: 2 } },
        { text: "シンプルで本質的なフレーズに落とし込むこと", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "他人の説明を聞いて「わかりにくい」と感じる理由は？", options: [
        { text: "話の構成や順序がバラバラ", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "主張の根拠や前提が曖昧", scores: { [AXES.CONDITION]: 2 } },
        { text: "抽象的すぎて具体的なイメージが湧かない", scores: { [AXES.CONCRETE]: 2 } },
        { text: "ダラダラと長くてポイントが見えない", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "不確定要素が多い状況での対応は？", options: [
        { text: "仮説に基づいて全体シナリオを複数作る", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "確定している条件と未確定の条件を分ける", scores: { [AXES.CONDITION]: 2 } },
        { text: "判断を急がず、情報が集まるまで状況を見極める", scores: { [AXES.HOLD]: 2 } },
        { text: "目の前にある具体的な小タスクから手を付ける", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "問題解決の場で得意な役割は？", options: [
        { text: "複雑な状況を整理して可視化する役割", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "論理的な穴やリスクを指摘する役割", scores: { [AXES.CONDITION]: 2 } },
        { text: "経緯を踏まえて関係者の意図を繋ぐ役割", scores: { [AXES.CONTEXT]: 2 } },
        { text: "複雑な議論を最後の一言にまとめる役割", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "新しい概念を学ぶ時の得意なスタイルは？", options: [
        { text: "全体像や分類表から理解する", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "どのような定義や条件で成り立つか理解する", scores: { [AXES.CONDITION]: 2 } },
        { text: "具体的な事例や実際のコード・サンプルを見る", scores: { [AXES.CONCRETE]: 2 } },
        { text: "その歴史的背景や開発された経緯を知る", scores: { [AXES.CONTEXT]: 2 } }
    ]},
    { text: "議論が迷走した時、どう立て直す？", options: [
        { text: "これまでの議論をカテゴリーごとに整理し直す", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "そもそも何を目指しているのか目的・前提に戻る", scores: { [AXES.CONDITION]: 2 } },
        { text: "一言で言うと何が問題なのかを再定義する", scores: { [AXES.COMPRESS]: 2 } },
        { text: "一度思考を停止し、冷静に論点を整理する時間を置く", scores: { [AXES.HOLD]: 2 } }
    ]},
    { text: "情報を整理する時に一番やりたいことは？", options: [
        { text: "マインドマップや体系図を作りたい", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "チェックリストや条件分岐を作りたい", scores: { [AXES.CONDITION]: 2 } },
        { text: "要約文やキャッチコピーを作りたい", scores: { [AXES.COMPRESS]: 2 } },
        { text: "具体的な体験談やケーススタディをまとめたい", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "自分の仕事の振り返りをする時、考えることは？", options: [
        { text: "プロセスの全体構造に問題がなかったか", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "事前の想定や条件設定が合っていたか", scores: { [AXES.CONDITION]: 2 } },
        { text: "今回の経験から得られた本質的な教訓（一行）", scores: { [AXES.COMPRESS]: 2 } },
        { text: "発生した具体的なトラブルとその対応データ", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "判断を保留することに対する感覚は？", options: [
        { text: "無理に決めず、保留にして観察するのも重要な判断", scores: { [AXES.HOLD]: 2 } },
        { text: "条件が不十分なら保留にするのが論理的", scores: { [AXES.CONDITION]: 2 } },
        { text: "背景情報がわかるまでは保留にしておきたい", scores: { [AXES.CONTEXT]: 2 } },
        { text: "できればすぐに仮説でも結論を出したい", scores: { [AXES.COMPRESS]: 1, [AXES.CONCRETE]: 1 } }
    ]},
    { text: "人にアドバイスをする時に心がけるのは？", options: [
        { text: "相手の状況を整理してマップ化してあげる", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "判断の基準や考えるべき条件を伝える", scores: { [AXES.CONDITION]: 2 } },
        { text: "自分の具体的な体験談や事例を伝える", scores: { [AXES.CONCRETE]: 2 } },
        { text: "相手がどういう経緯で悩んでいるのかを聴く", scores: { [AXES.CONTEXT]: 2 } }
    ]},
    { text: "仕事でストレスを感じやすい瞬間は？", options: [
        { text: "整理されていないカオスな状態が続くこと", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "筋の通らない理由で決定が覆ること", scores: { [AXES.CONDITION]: 2 } },
        { text: "結論だけ求められ、背景やプロセスを無視されること", scores: { [AXES.CONTEXT]: 2 } },
        { text: "十分な検討時間を与えられず即答を迫られること", scores: { [AXES.HOLD]: 2 } }
    ]},
    { text: "プレゼンを準備する時、最初に作るものは？", options: [
        { text: "アジェンダや全体のアウトライン", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "主張の根拠となるデータやロジック", scores: { [AXES.CONDITION]: 2 } },
        { text: "聞き手の状況や背景ストーリー", scores: { [AXES.CONTEXT]: 2 } },
        { text: "メインのキーフレーズやスライドの要約", scores: { [AXES.COMPRESS]: 2 } }
    ]},
    { text: "抽象的な議論が続いている時の気分は？", options: [
        { text: "「具体的な例を1つ出してみよう」と言いたくなる", scores: { [AXES.CONCRETE]: 2 } },
        { text: "「要するに何が言いたいの？」とまとめたくなる", scores: { [AXES.COMPRESS]: 2 } },
        { text: "「どのような条件でそれが成立するの？」と確認したくなる", scores: { [AXES.CONDITION]: 2 } },
        { text: "「全体の中でどの話をしているの？」と整理したくなる", scores: { [AXES.STRUCTURE]: 2 } }
    ]},
    { text: "過去の出来事を思い出す時に浮かぶのは？", options: [
        { text: "その時の状況や関係性のニュアンス", scores: { [AXES.CONTEXT]: 2 } },
        { text: "印象的だった場面や具体的な出来事", scores: { [AXES.CONCRETE]: 2 } },
        { text: "その出来事が起きた原因や論理的結果", scores: { [AXES.CONDITION]: 2 } },
        { text: "その出来事の全体的な流れや位置づけ", scores: { [AXES.STRUCTURE]: 2 } }
    ]},
    { text: "自分が納得しやすい説明の型は？", options: [
        { text: "全体像 → 各論 という順番", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "前提 → 理由 → 結論 という順序", scores: { [AXES.CONDITION]: 2 } },
        { text: "背景・ストーリー → 結論 という順序", scores: { [AXES.CONTEXT]: 2 } },
        { text: "結論 → 具体的な事例 という順序", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "新しいツールやシステムを導入する時、知りたいのは？", options: [
        { text: "全体の中でどう機能するかというシステム構成", scores: { [AXES.STRUCTURE]: 2 } },
        { text: "導入するための動作条件や要件", scores: { [AXES.CONDITION]: 2 } },
        { text: "実際の画面イメージや具体的な操作方法", scores: { [AXES.CONCRETE]: 2 } },
        { text: "なぜそのツールが必要になったのかの経緯", scores: { [AXES.CONTEXT]: 2 } }
    ]},
    { text: "意思決定をする時に最後に確認することは？", options: [
        { text: "決定のロジックや論理に破綻がないか", scores: { [AXES.CONDITION]: 2 } },
        { text: "決めきれない要素を未決事項として認識したか", scores: { [AXES.HOLD]: 2 } },
        { text: "言葉としてシンプルに整理されているか", scores: { [AXES.COMPRESS]: 2 } },
        { text: "現場の具体的な運用イメージが湧いているか", scores: { [AXES.CONCRETE]: 2 } }
    ]},
    { text: "他人の話で「なるほど」と感心するのはどんな時？", options: [

// ==========================================
// 1. SCORE_BOUNDS の自動算出ロジック
// ==========================================

function calculateScoreBounds(questions) {
    const bounds = {};
    
    // 各軸を0で初期化
    Object.values(AXES).forEach(axis => {
        bounds[axis] = { min: 0, max: 0 };
    });

    // 設問ごとに各軸が取り得る最小・最大配点を加算
    questions.forEach(q => {
        const qBounds = {};
        
        q.options.forEach(opt => {
            Object.entries(opt.scores).forEach(([axis, score]) => {
                if (!qBounds[axis]) {
                    qBounds[axis] = { min: score, max: score };
                } else {
                    qBounds[axis].min = Math.min(qBounds[axis].min, score);
                    qBounds[axis].max = Math.max(qBounds[axis].max, score);
                }
            });
        });

        // 全体バウンズに加算
        Object.entries(qBounds).forEach(([axis, b]) => {
            if (bounds[axis]) {
                bounds[axis].min += b.min;
                bounds[axis].max += b.max;
            }
        });
    });

    return bounds;
}

// 質問データから理論上の最小・最大値を自動取得
const SCORE_BOUNDS = calculateScoreBounds(QUESTIONS);


// プロファイル組み合わせテキスト定義（能力ではなく処理傾向を記述）

// フォールバック用の汎用テキスト生成関数
function getFallbackProfile(top1, top2) {
    return {
        overview: `${AXIS_NAMES[top1]}と${AXIS_NAMES[top2]}の視点を優先的に組み合わせ、情報を整理・解釈しようとする処理スタイルです。`,
        frequentBehaviors: [

        ],

        ]
    };
}


// ==========================================
// 診断処理ロジック
// ==========================================

let currentQuestionIndex = 0;
let rawScores = {};

function initScores() {
    rawScores = {};
    Object.values(AXES).forEach(axis => {
        rawScores[axis] = 0;
    });
}

function startQuiz() {
    initScores();
    currentQuestionIndex = 0;
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    showQuestion();
}

function showQuestion() {
    const q = QUESTIONS[currentQuestionIndex];
    document.getElementById('question-number').textContent = `質問 ${currentQuestionIndex + 1} / ${QUESTIONS.length}`;
    document.getElementById('question-text').textContent = q.text;
    
    const progressPercent = ((currentQuestionIndex) / QUESTIONS.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(opt.scores);
        container.appendChild(btn);
    });
}

function selectOption(scores) {
    Object.entries(scores).forEach(([axis, val]) => {
        if (rawScores[axis] !== undefined) {
            rawScores[axis] += val;
        }
    });

    currentQuestionIndex++;
    if (currentQuestionIndex < QUESTIONS.length) {
        showQuestion();
    } else {
        showResult();
    }
}

// 2. 正規化と分布パターンの判定ロジック

function normalizeScores(raw) {
    const normalized = {};
    Object.keys(raw).forEach(axis => {
        const { min, max } = SCORE_BOUNDS[axis];
        if (max === min) {
            normalized[axis] = 0;
        } else {
            const score = Math.max(min, Math.min(max, raw[axis]));
            normalized[axis] = Math.round(((score - min) / (max - min)) * 100);
        }
    });
    return normalized;
}

function analyzeDistribution(normalizedScores) {
    const values = Object.values(normalizedScores);
    const sorted = [...values].sort((a, b) => b - a);
    
    const mean = values.reduce((sum, val) => sum + val, 0) / values.length;
    const variance = values.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / values.length;
    const stdDev = Math.sqrt(variance);
    
    const diffTop1Top2 = sorted[0] - sorted[1];

    if (stdDev > 16 || diffTop1Top2 >= 18) {
        return {
            type: 'PROMINENT',
            label: '特定処理が前に出るプロファイル',
            description: '特定の情報処理スタイルが強く選択されやすく、状況によって処理の好みがはっきり分かれやすい傾向があります。'
        };
    } else if (stdDev < 8 && diffTop1Top2 < 10) {
        return {
            type: 'BALANCED',
            label: '複数の処理が近いプロファイル',
            description: '特定の処理だけに偏らず、複数の情報処理スタイルを近い頻度で選択しやすい傾向があります。'
        };
    } else {
        return {
            type: 'MODERATE',
            label: 'バランス型のプロファイル',
            description: '主軸となる処理を持ちつつも、状況に応じて他の処理スタイルも並行して使い分けやすい傾向があります。'
        };
    }
}

function generateDiagnosticResult(raw) {
    const normalized = normalizeScores(raw);
    
    const sortedAxes = Object.entries(normalized)
        .sort(([, a], [, b]) => b - a)
        .map(([axis]) => axis);

    const top1 = sortedAxes[0];
    const top2 = sortedAxes[1];

    const distribution = analyzeDistribution(normalized);

    const combinationKey = `${top1}_${top2}`;
    const baseProfile = PROFILE_COMBINATIONS[combinationKey] || getFallbackProfile(top1, top2);

    return {
        scores: normalized,
        primaryAxes: [top1, top2],
        distribution: distribution,
        display: {
            title: `${AXIS_NAMES[top1]} × ${AXIS_NAMES[top2]}`,
            distributionLabel: distribution.label,
            overview: baseProfile.overview + ' ' + distribution.description,
            frequentBehaviors: baseProfile.frequentBehaviors,
            cognitiveCosts: baseProfile.cognitiveCosts
        }
    };
}

// 描画機能
let chartInstance = null;

function showResult() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const result = generateDiagnosticResult(rawScores);

    document.getElementById('result-title').textContent = result.display.title;
    document.getElementById('result-distribution-tag').textContent = result.display.distributionLabel;
    document.getElementById('result-overview').textContent = result.display.overview;

    const frequentList = document.getElementById('list-frequent');
    frequentList.innerHTML = '';
    result.display.frequentBehaviors.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        frequentList.appendChild(li);
    });

    const costsList = document.getElementById('list-costs');
    costsList.innerHTML = '';
    result.display.cognitiveCosts.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        costsList.appendChild(li);
    });

    renderChart(result.scores);
}

function renderChart(normalizedScores) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    
    const labels = [
        AXIS_NAMES[AXES.STRUCTURE],
        AXIS_NAMES[AXES.CONDITION],
        AXIS_NAMES[AXES.CONTEXT],
        AXIS_NAMES[AXES.HOLD],
        AXIS_NAMES[AXES.CONCRETE],
        AXIS_NAMES[AXES.COMPRESS]
    ];

    const dataValues = [
        normalizedScores[AXES.STRUCTURE],
        normalizedScores[AXES.CONDITION],
        normalizedScores[AXES.CONTEXT],
        normalizedScores[AXES.HOLD],
        normalizedScores[AXES.CONCRETE],
        normalizedScores[AXES.COMPRESS]
    ];

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                label: '認知処理の選択傾向 (0-100)',
                data: dataValues,
                backgroundColor: 'rgba(37, 99, 235, 0.2)',
                borderColor: 'rgba(37, 99, 235, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(37, 99, 235, 1)'
            }]
        },
        options: {
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: {
                        stepSize: 20,
                        display: false
                    },
                    pointLabels: {
                        font: {
                            size: 12
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
}

function resetQuiz() {
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
}
