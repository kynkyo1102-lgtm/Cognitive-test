<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 30問でわかる情報処理プロファイル</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 32px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-text {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-align: right;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .category-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            background-color: #eff6ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        /* 結果画面 */
        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .result-subtitle {
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 32px auto;
        }

        /* 取扱説明書カード */
        .instruction-card {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .instruction-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .section-box {
            margin-bottom: 16px;
        }

        .section-box:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-content {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
        }

        .restart-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
            margin-top: 16px;
        }

        .restart-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="quiz-screen">
        <div class="progress-container">
            <div class="progress-text" id="progress-text">Q1 / 30</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
        <div class="category-badge" id="category-badge">Ⅰ. 情報の受け取り方</div>
        <div class="question-title" id="question-text">質問文がここに表示されます</div>
        <div class="options-container" id="options-container">
            <!-- 4つの選択肢ボタン -->
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
        <div class="result-title">あなたの認知プロファイル</div>
        <div class="result-subtitle">30問の回答から分析された「情報処理の癖」</div>
        
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="instruction-card">
            <div class="instruction-header" id="type-title">メインスタイル</div>
            
            <div class="section-box">
                <div class="section-title">🧠 情報処理の特徴</div>
                <p class="section-content" id="type-feature"></p>
            </div>

            <div class="section-box">
                <div class="section-title">⚡ 得意になりやすい処理</div>
                <p class="section-content" id="type-strength"></p>
            </div>

            <div class="section-box">
                <div class="section-title">⚠ 負荷がかかりやすい処理（認知コスト高）</div>
                <p class="section-content" id="type-cost"></p>
            </div>

            <div class="section-box">
                <div class="section-title">💡 認知の取扱説明書（アドバイス）</div>
                <p class="section-content" id="type-advice"></p>
            </div>
        </div>

        <button class="restart-btn" onclick="restartQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 6つの認知スタイル軸
    // 1. 構造化型 (Structure): 全体像・論理・整理を重視
    // 2. 条件分析型 (Analysis): 前提・因果・境界・検証を重視
    // 3. 文脈読解型 (Context): 背景・心理・他者・関係性を重視
    // 4. 保留・慎重型 (Hold): 拙速な判断の回避・不確実さへの耐性
    // 5. 探索・試行型 (Explore): とりあえず行動・具体例・体験重視
    // 6. 圧縮・要約型 (Compress): 結論・要約・効率重視

    const questions = [
        // Ⅰ. 情報の受け取り方
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "ある出来事について、AさんとBさんの説明が食い違っています。あなたなら？",
            options: [
                { text: "A. どちらか一方の説明をひとまず採用する", style: "Compress" },
                { text: "B. 両方の話を聞いて共通点を探す", style: "Structure" },
                { text: "C. 情報が足りないので判断を保留する", style: "Hold" },
                { text: "D. なぜ説明が食い違ったのかを考える", style: "Context" }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "長い文章を読むとき、あなたは？",
            options: [
                { text: "A. 最初から最後まで順番に読む", style: "Explore" },
                { text: "B. まず結論を探す", style: "Compress" },
                { text: "C. 必要そうなところだけ拾い読む", style: "Analysis" },
                { text: "D. 全体の構造を把握してから読む", style: "Structure" }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "初めて聞く話に知らない言葉がたくさん出てきた。",
            options: [
                { text: "A. とりあえず読み進める", style: "Explore" },
                { text: "B. その言葉の意味を調べる", style: "Analysis" },
                { text: "C. 前後の文脈から推測する", style: "Context" },
                { text: "D. 全体が分かれば細部は気にしない", style: "Structure" }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "「最近こういう人が増えた」と言われた。",
            options: [
                { text: "A. そういうこともあると思う", style: "Explore" },
                { text: "B. 何を根拠に「増えた」と言っているのか気になる", style: "Analysis" },
                { text: "C. 自分の周囲でもそうか確認する", style: "Context" },
                { text: "D. そういう一般論はあまり信用しない", style: "Hold" }
            ]
        },
        {
            category: "Ⅰ. 情報の受け取り方",
            text: "説明を聞いていて「なんとなく違う気がする」と感じた。",
            options: [
                { text: "A. その感覚を一旦置いておく", style: "Hold" },
                { text: "B. どこが違うのか言葉にしてみる", style: "Compress" },
                { text: "C. 自分の理解が間違っていないか確認する", style: "Structure" },
                { text: "D. 説明の前提から見直す", style: "Analysis" }
            ]
        },

        // Ⅱ. 推論・問題の組み立て方
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "ある方法を試したら、予想と違う結果になった。",
            options: [
                { text: "A. 結果をそのまま受け入れる", style: "Explore" },
                { text: "B. 自分の予想のどこが間違っていたか考える", style: "Structure" },
                { text: "C. 条件によって結果が変わった可能性を考える", style: "Analysis" },
                { text: "D. そもそもの前提が間違っていなかったか考える", style: "Hold" }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "複雑な問題を解くことになった。",
            options: [
                { text: "A. とりあえず手を動かしてみる", style: "Explore" },
                { text: "B. 問題を細かく分解する", style: "Analysis" },
                { text: "C. まず全体像を把握する", style: "Structure" },
                { text: "D. 似た問題の解決方法を探す", style: "Compress" }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "「この方法なら絶対うまくいく」と説明された。",
            options: [
                { text: "A. 成功例があるなら試してみる", style: "Explore" },
                { text: "B. どういう条件ならうまくいくのか聞く", style: "Analysis" },
                { text: "C. 「絶対」という言葉が気になる", style: "Hold" },
                { text: "D. 自分の場合にも当てはまるか考える", style: "Context" }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "二つの出来事が続けて起きた。「Aの後にBが起きた」という事実がある。",
            options: [
                { text: "A. AがBに影響した可能性を考える", style: "Structure" },
                { text: "B. 他にも原因がないか考える", style: "Analysis" },
                { text: "C. 関係があるかどうかはまだ分からないと思う", style: "Hold" },
                { text: "D. まずAとBそれぞれの事情を見る", style: "Context" }
            ]
        },
        {
            category: "Ⅱ. 推論・問題の組み立て方",
            text: "問題の解決策を考えるとき、一番気になるのは？",
            options: [
                { text: "A. すぐ実行できるか", style: "Explore" },
                { text: "B. なぜその問題が起きているのか", style: "Analysis" },
                { text: "C. 他にどんな方法があるか", style: "Structure" },
                { text: "D. その方法が別の問題を生まないか", style: "Hold" }
            ]
        },

        // Ⅲ. 不確実さとの付き合い方
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "情報が十分ではないけれど、今日中に判断しなければならない。",
            options: [
                { text: "A. 今ある情報で決める", style: "Compress" },
                { text: "B. 重要な情報だけ追加で集める", style: "Analysis" },
                { text: "C. 不確実な部分を残したまま決める", style: "Explore" },
                { text: "D. 判断そのものを延期できないか考える", style: "Hold" }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "「この話、本当かどうか分からない」と言われた。",
            options: [
                { text: "A. 分からないなら保留する", style: "Hold" },
                { text: "B. 本当だとしたら何が起きるか考える", style: "Structure" },
                { text: "C. 嘘だとしたら何が起きるか考える", style: "Analysis" },
                { text: "D. 確認できる情報を探す", style: "Explore" }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "自分の予想と現実が食い違った。",
            options: [
                { text: "A. 現実を優先する", style: "Explore" },
                { text: "B. 予想が外れた理由を探す", style: "Analysis" },
                { text: "C. どちらにも成立する条件があると考える", style: "Structure" },
                { text: "D. しばらく様子を見る", style: "Hold" }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "ある問題について専門家の意見が二つに分かれている。",
            options: [
                { text: "A. より信頼できそうな方を選ぶ", style: "Compress" },
                { text: "B. それぞれの前提を比較する", style: "Analysis" },
                { text: "C. まだ結論が出ていないと考える", style: "Hold" },
                { text: "D. 自分に関係する部分だけ考える", style: "Context" }
            ]
        },
        {
            category: "Ⅲ. 不確実さとの付き合い方",
            text: "「分からない」と答えることについて、一番近いのは？",
            options: [
                { text: "A. できれば避けたい", style: "Compress" },
                { text: "B. 情報がなければ普通にそう答える", style: "Analysis" },
                { text: "C. 分からない状態のほうが気になる", style: "Structure" },
                { text: "D. 分からないまま考え続けることも多い", style: "Hold" }
            ]
        },

        // Ⅳ. 自分の認知を見る
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分の考えと反対の意見を見つけた。",
            options: [
                { text: "A. まず反論を考える", style: "Compress" },
                { text: "B. なぜその人がそう考えるのか考える", style: "Context" },
                { text: "C. 自分の考えに修正できるところがないか考える", style: "Analysis" },
                { text: "D. 自分とは関係ない意見として流す", style: "Hold" }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "誰かから「考え方が偏っている」と言われた。",
            options: [
                { text: "A. 具体的にどこが偏っているのか聞く", style: "Analysis" },
                { text: "B. その人自身の偏りも考える", style: "Context" },
                { text: "C. 自分では判断できないので保留する", style: "Hold" },
                { text: "D. 自分の考えには自分なりの理由があると思う", style: "Structure" }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "あとから考えると、自分の判断が間違っていた。",
            options: [
                { text: "A. 間違っていたと認める", style: "Explore" },
                { text: "B. 何が判断を誤らせたのか分析する", style: "Analysis" },
                { text: "C. 当時の状況なら仕方なかったと思う", style: "Context" },
                { text: "D. 次に同じことが起きたときの対策を考える", style: "Structure" }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分が何かを嫌いだと気づいた。",
            options: [
                { text: "A. 嫌いなのだからそれでいい", style: "Explore" },
                { text: "B. なぜ嫌いなのか考える", style: "Analysis" },
                { text: "C. 自分の経験が影響しているか考える", style: "Context" },
                { text: "D. 嫌いでも必要なら受け入れる", style: "Compress" }
            ]
        },
        {
            category: "Ⅳ. 自分の認知を見る",
            text: "自分について考えていて、「自分はこういう人間だ」と思った。",
            options: [
                { text: "A. それまでの経験を振り返って確かめる", style: "Structure" },
                { text: "B. 反例がないか探す", style: "Analysis" },
                { text: "C. 今の自分についてはそうだと思う", style: "Explore" },
                { text: "D. 状況によって変わるものだと思う", style: "Context" }
            ]
        },

        // Ⅴ. 他者・文脈の読み取り
        {
            category: "Ⅴ. 他者・文脈の読み取り",
            text: "友人が「別にいいよ」と言った。でも、少し不機嫌そうに見える。",
            options: [
                { text: "A. 言葉どおり受け取る", style: "Compress" },
                { text: "B. 表情や状況も含めて考える", style: "Context" },
                { text: "C. 本人に確認する", style: "Explore" },
                { text: "D. 自分の思い込みかもしれないので判断しない", style: "Hold" }
            ]
        },
        {
            category: "Ⅴ. 他者・文脈の読み取り",
            text: "誰かが突然、普段と違う行動をした。",
            options: [
                { text: "A. その行動だけを見る", style: "Compress" },
                { text: "B. 直前に何があったか考える", style: "Context" },
                { text: "C. その人の普段の傾向と比較する", style: "Structure" },
                { text: "D. 本人に聞かないと分からないと思う", style: "Hold" }
            ]
        },
        {
            category: "Ⅴ. 他者・文脈の読み取り",
            text: "ある発言が失礼に聞こえた。",
            options: [
                { text: "A. 発言内容そのものを問題にする", style: "Compress" },
                { text: "B. 言った人の意図を考える", style: "Context" },
                { text: "C. その場の状況を考える", style: "Structure" },
                { text: "D. 自分がどう受け取ったかをまず考える", style: "Analysis" }
            ]
        },
        {
            category: "Ⅴ. 他者・文脈の読み取り",
            text: "同じ言葉なのに、人によって印象が違う。",
            options: [
                { text: "A. 言葉そのものより言い方の問題だと思う", style: "Context" },
                { text: "B. 受け取る側の経験も関係すると思う", style: "Analysis" },
                { text: "C. 関係性や状況が大きいと思う", style: "Structure" },
                { text: "D. 人によって違うので一概には言えない", style: "Hold" }
            ]
        },
        {
            category: "Ⅴ. 他者・文脈の読み取り",
            text: "誰かの行動に「なんでそんなことするんだろう」と思った。",
            options: [
                { text: "A. 自分ならしないと思う", style: "Compress" },
                { text: "B. その人にとっての合理性を考える", style: "Analysis" },
                { text: "C. その人が置かれている状況を見る", style: "Context" },
                { text: "D. 本人にしか分からないと思う", style: "Hold" }
            ]
        },

        // Ⅵ. 情報の整理・圧縮
        {
            category: "Ⅵ. 情報の整理・圧縮",
            text: "人から長い相談をされた。話があちこちに飛んでいる。",
            options: [
                { text: "A. とりあえず最後まで聞く", style: "Context" },
                { text: "B. 要点を整理して確認する", style: "Structure" },
                { text: "C. 一番困っていることを聞く", style: "Compress" },
                { text: "D. 話の流れから全体像を組み立てる", style: "Analysis" }
            ]
        },
        {
            category: "Ⅵ. 情報の整理・圧縮",
            text: "複数の情報を人に説明することになった。",
            options: [
                { text: "A. 時系列順に説明する", style: "Explore" },
                { text: "B. 結論から説明する", style: "Compress" },
                { text: "C. 重要度の高い順に説明する", style: "Structure" },
                { text: "D. 相手が知っていることに合わせて変える", style: "Context" }
            ]
        },
        {
            category: "Ⅵ. 情報の整理・圧縮",
            text: "情報が多すぎて整理できない。",
            options: [
                { text: "A. まず全部書き出す", style: "Explore" },
                { text: "B. 不要な情報を捨てる", style: "Compress" },
                { text: "C. 分類してグループ化する", style: "Structure" },
                { text: "D. そもそも何を決めるための情報なのか考える", style: "Analysis" }
            ]
        },
        {
            category: "Ⅵ. 情報の整理・圧縮",
            text: "誰かに説明するとき、「分かりやすくして」と言われた。",
            options: [
                { text: "A. 難しい言葉を簡単な言葉に変える", style: "Compress" },
                { text: "B. 情報量を減らす", style: "Structure" },
                { text: "C. 具体例を出す", style: "Explore" },
                { text: "D. 相手がどこでつまずいているのか確認する", style: "Context" }
            ]
        },
        {
            category: "Ⅵ. 情報の整理・圧縮",
            text: "複雑なことを一言で表す必要がある。",
            options: [
                { text: "A. 一番重要な部分だけ残す", style: "Compress" },
                { text: "B. 誤解されない表現を優先する", style: "Analysis" },
                { text: "C. あえて一言にしない", style: "Hold" },
                { text: "D. 前提を含めて短くまとめる", style: "Structure" }
            ]
        }
    ];

    // プロファイル定義
    const profiles = {
        Structure: {
            title: "【構造化思考型】全体像と枠組みの建築家",
            feature: "散らかった情報を分類し、全体像やシステムとして捉えることを重視します。関係性や構造が明確になると頭がスッキリするタイプです。",
            strength: "・情報の分類や整理整頓\n・ロードマップや全体像の可視化\n・複雑な問題のロードマップ化",
            cost: "・構造化できない混沌とした状態の放置\n・目的や枠組みが定まらないフワッとした会話",
            advice: "完璧な分類にこだわりすぎず、時には「未分類のまま進める柔軟さ」を持つことで意思決定が加速します。"
        },
        Analysis: {
            title: "【条件・検証分析型】前提と境界線の解剖医",
            feature: "「なぜ？」「どういう条件で成立する？」と前提や因果関係を深掘りします。見逃されがちな矛盾や適用条件に敏感です。",
            strength: "・前提条件や例外パターンの洗い出し\n・論理的な矛盾やリスクの早期発見\n・客観的なファクトベースの議論",
            cost: "・根拠の薄い状態での即断即決\n・「とりあえずやってみよう」というノリ重視の進行",
            advice: "分析そのものが目的にならないよう、「今の目的を達成するには何割の検証で十分か」の線引きをあらかじめ決めましょう。"
        },
        Context: {
            title: "【文脈・関係読解型】背景と場の空気の解読者",
            feature: "言葉そのものだけでなく、相手の立場、背景、場の空気、これまでの経緯など「行間（文脈）」を読み取って処理します。",
            strength: "・他者の意図や感情の汲み取り\n・状況に応じた柔軟なコミュニケーション\n・背景やストーリーを考慮した調整",
            cost: "・文脈が断絶された箇条書きのみの機械的な指示\n・感情や意図を完全に無視した合理的すぎる決定",
            advice: "深読みしすぎて判断が複雑化することがあります。「文字通りの意味」でシンプルに受け取る練習も効果的です。"
        },
        Hold: {
            title: "【保留・慎重探索型】不確実さへの耐性と観察者",
            feature: "情報が揃っていない時に無理に結論を出さず、「分からないものは分からない」として保留・観察を維持できます。",
            strength: "・拙速な誤断を防ぐストッパー機能\n・思い込みを排除した冷静な観察\n・複雑で不確実な状況下での耐久性",
            cost: "・その場での素早い決断やコミットメント\n・白黒をハッキリつけることを求められるプレッシャー",
            advice: "保留は強みですが、時には「暫定の仮説」を1つ置いて動いてみることで、新しい情報が得られやすくなります。"
        },
        Explore: {
            title: "【試行・具体体験型】実践とフィードバックの探求者",
            feature: "頭の中でこねくり回すよりも、「まずやってみる」「具体例を見る」ことでリアルタイムに情報を処理・学習します。",
            strength: "・圧倒的な行動力とプロトタイピング\n・現実のフィードバックからの高速学習\n・現場感のある具体的なアイデア出し",
            cost: "・事前のアブストラクト（抽象論）や長時間の議論\n・マニュアルや規律をきっちり読み込む作業",
            advice: "動きながら考えるのが得意ですが、大きな決定の前には「一度立ち止まって全体を見渡す」時間を作ると安全です。"
        },
        Compress: {
            title: "【要約・核心圧縮型】結論ファーストの優先順位決定者",
            feature: "「結局何が重要か？」に素早く焦点を合わせ、余分な情報を削ぎ落として結論や核心を短くまとめます。",
            strength: "・迅速な意思決定と実行\n・簡潔で分かりやすい要点伝達\n・重要度の低い情報のカット",
            cost: "・長々とまとまりなく続く話の傾聴\n・細部やニュアンスをじっくり吟味する作業",
            advice: "効率を重視するあまり、重要だが目立たない前提条件や他者の感情を削ぎ落としすぎないよう一呼吸おきましょう。"
        }
    };

    let currentQuestionIndex = 0;
    let scores = {
        Structure: 0,
        Analysis: 0,
        Context: 0,
        Hold: 0,
        Explore: 0,
        Compress: 0
    };

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const categoryBadge = document.getElementById("category-badge");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    let radarChartInstance = null;

    function initQuiz() {
        currentQuestionIndex = 0;
        scores = { Structure: 0, Analysis: 0, Context: 0, Hold: 0, Explore: 0, Compress: 0 };
        quizScreen.classList.remove("hidden");
        resultScreen.classList.add("hidden");
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        categoryBadge.textContent = q.category;
        questionText.textContent = `Q${currentQuestionIndex + 1}. ${q.text}`;
        
        progressText.textContent = `Q${currentQuestionIndex + 1} / ${questions.length}`;
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

        optionsContainer.innerHTML = "";
        
        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt.text;
            btn.onclick = () => selectOption(opt.style);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(style) {
        if (style && scores.hasOwnProperty(style)) {
            scores[style]++;
        }
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");

        // 最高スコアの軸を判定
        let maxStyle = "Structure";
        let maxScore = -1;
        for (const style in scores) {
            if (scores[style] > maxScore) {
                maxScore = scores[style];
                maxStyle = style;
            }
        }

        // 取扱説明書の描画
        const profile = profiles[maxStyle];
        document.getElementById("type-title").textContent = profile.title;
        document.getElementById("type-feature").textContent = profile.feature;
        document.getElementById("type-strength").textContent = profile.strength;
        document.getElementById("type-cost").textContent = profile.cost;
        document.getElementById("type-advice").textContent = profile.advice;

        // チャートの描画
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (radarChartInstance) {
            radarChartInstance.destroy();
        }

        radarChartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['構造化', '条件・検証', '文脈読解', '保留・慎重', '試行・具体', '要約・圧縮'],
                datasets: [{
                    label: '処理の出現回数',
                    data: [
                        scores.Structure,
                        scores.Analysis,
                        scores.Context,
                        scores.Hold,
                        scores.Explore,
                        scores.Compress
                    ],
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(59, 130, 246, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        pointLabels: {
                            font: { size: 11, weight: 'bold' },
                            color: '#0f172a'
                        },
                        suggestedMin: 0,
                        suggestedMax: 10,
                        ticks: { stepSize: 2 }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function restartQuiz() {
        initQuiz();
    }

    // 診断スタート
    initQuiz();
</script>
</body>
</html>
