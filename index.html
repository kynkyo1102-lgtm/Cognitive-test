<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 30問でわかる情報処理プロファイル</title>
    <!-- Chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text-main);
            text-align: center;
        }

        p.description {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 24px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            margin-top: 20px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* 質問画面 */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .option-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* 結果画面 */
        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .result-distribution-tag {
            display: inline-block;
            background-color: #eff6ff;
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid #bfdbfe;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 24px auto;
        }

        .section-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-box h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .section-box ul, .section-box ol {
            padding-left: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .section-box li {
            margin-bottom: 4px;
        }

        .note-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 24px;
            line-height: 1.4;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- スタート画面 -->
    <div id="screen-start">
        <h1>認知スタイル診断</h1>
        <p class="description">普段自然に選択しやすい「情報処理のスタイル」を可視化する診断です。（全30問）</p>
        <button class="btn" onclick="startQuiz()">診断を始める</button>
    </div>

    <!-- 質問画面 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="question-number" class="question-number">質問 1 / 30</div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-container"></div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="hidden">
        <div class="result-header">
            <p style="font-size:0.85rem; color:var(--text-sub);">あなたの情報処理プロファイル</p>
            <div id="result-title" class="result-title"></div>
            <div id="result-distribution-tag" class="result-distribution-tag"></div>
            <p id="result-overview" class="description" style="text-align:left;"></p>
        </div>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="section-box">
            <h3>主に出やすい処理（上位3軸）</h3>
            <ol id="list-top-axes" style="font-weight: 600; color: var(--text-main);"></ol>
        </div>

        <div class="section-box">
            <h3>出やすい処理</h3>
            <ul id="list-frequent"></ul>
        </div>

        <div class="section-box">
            <h3>認知コストが上がりやすそうな場面</h3>
            <ul id="list-costs"></ul>
        </div>

        <p class="note-text">※ この診断は個人の情報処理の好みを表すものであり、能力の優劣や適性を特定するものではありません。</p>
        <button class="btn" onclick="resetQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
// ==========================================
// 定義データ
// ==========================================

const AXES = {
    STRUCTURE: 'STRUCTURE', // 構造化
    CONDITION: 'CONDITION', // 条件・検証
    CONTEXT: 'CONTEXT',     // 文脈
    HOLD: 'HOLD',           // 保留
    CONCRETE: 'CONCRETE',   // 具体
    COMPRESS: 'COMPRESS'    // 圧縮
};

const AXIS_NAMES = {
    [AXES.STRUCTURE]: '構造化',
    [AXES.CONDITION]: '条件・検証',
    [AXES.CONTEXT]: '文脈',
    [AXES.HOLD]: '保留',
    [AXES.CONCRETE]: '具体',
    [AXES.COMPRESS]: '圧縮'
};

// 全30問（配点データ）
const questions = [
  {
    id: 1,
    text: "新しい課題やプロジェクトが始まったとき、最初に確認したいことは？",
    options: [
      { text: "全体のロードマップや工程の組まれ方", scores: { STRUCTURE: 2 } },
      { text: "どのような背景や狙いで立ち上がったのか", scores: { CONTEXT: 2 } },
      { text: "具体的に何を成果物として出すべきか", scores: { CONCRETE: 2 } },
      { text: "達成すべき条件や制約（予算・納期・ルール）", scores: { CONDITION: 2 } }
    ]
  },
  {
    id: 2,
    text: "説明を受けていて「なんとなく腑に落ちない」と感じたとき、どうする？",

      { text: "全体の論理構成や抜け漏れを整理してみる", scores: { STRUCTURE: 2 } },
      { text: "「なぜその説明になったのか」相手の立場や文脈を探る", scores: { CONTEXT: 2 } },
      { text: "「具体的にどういうことか」例を出してもらう", scores: { CONCRETE: 2 } },
      { text: "すぐには判断せず、追加の情報が出るまで様子を見る", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 3,
    text: "複雑な事象を人に伝えるとき、意識することは？",
    options: [
      { text: "要点や結論を1つの言葉・一文に短くまとめる", scores: { COMPRESS: 2 } },
      { text: "図解や箇条書きで構造的に見せる", scores: { STRUCTURE: 2 } },
      { text: "実際の具体例やエピソードを交えて話す", scores: { CONCRETE: 2 } },
      { text: "どのような条件・前提での話なのかを明記する", scores: { CONDITION: 2 } }
    ]
  },
  {
    id: 4,
    text: "他人の意見が自分の認識と食い違っているとき、最初に考えることは？",
    options: [
      { text: "どのような背景や経験からその意見が出たのか", scores: { CONTEXT: 2 } },
      { text: "どちらの主張が全体のロジックとして通っているか", scores: { STRUCTURE: 2 } },
      { text: "前提条件や定義の捉え方がズレていないか", scores: { CONDITION: 2 } },
      { text: "結論を急がず、互いの主張の観察を続ける", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 5,
    text: "膨大な資料やデータを見せられたとき、最初にとる行動は？",
    options: [
      { text: "要約して「一言でいうと何か」を抽出する", scores: { COMPRESS: 2 } },
      { text: "目次や見出しを見て、全体構造を把握する", scores: { STRUCTURE: 2 } },
      { text: "手元の具体的な数字や実例に目を通す", scores: { CONCRETE: 2 } },
      { text: "判断材料が揃うまで一旦ストックしておく", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 6,
    text: "仕事や議論で「あいまいな表現」に出くわしたとき、どう感じる？",
    options: [
      { text: "「具体的にどの数値を指すのか」を確定させたい", scores: { CONCRETE: 2 } },
      { text: "「どういう条件なら適用できるか」をクリアにしたい", scores: { CONDITION: 2 } },
      { text: "「どういう文脈でその言葉が使われたか」を確かめたい", scores: { CONTEXT: 2 } },
      { text: "文脈によって意味が変わるので、一旦そのまま保持する", scores: { HOLD: 2 } }

  {

  {

    text: "予期せぬトラブルや仕様変更が発生したとき、どう反応する？",

      { text: "全体プロセスのどこを修正すべきか再構造化する", scores: { STRUCTURE: 2 } },
      { text: "「何が起きているか」を端的・要約して関係者に共有する", scores: { COMPRESS: 2 } }

  },
  {

  },
  {
    id: 10,
    text: "「優秀な説明」と聞いて真っ先に思い浮かぶ特徴は？",
    options: [
      { text: "無駄な言葉がなく、一言で本質が伝わる", scores: { COMPRESS: 2 } },
      { text: "体系的で、話のつながりや論理構造が明確", scores: { STRUCTURE: 2 } },

    ]
  },
  {
    id: 11,
    text: "未経験の新しいツールやシステムを導入するとき、どう触り始める？",
    options: [
      { text: "まずは実際のサンプルデータを入れて動かしてみる", scores: { CONCRETE: 2 } },
      { text: "マニュアルや設定条件、利用規約をじっくり読む", scores: { CONDITION: 2 } },
      { text: "ツールが作られた思想や開発背景を理解しようとする", scores: { CONTEXT: 2 } },
      { text: "すぐに使いこなそうとせず、操作感を観察しながら慣れる", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 12,
    text: "長時間の議論の末、収束しなくなったときにとりたい役割は？",
    options: [
      { text: "これまでの議論を1分程度で要約・整理する", scores: { COMPRESS: 2 } },
      { text: "「ここまでは確定、ここからは未定」と境界線を整理する", scores: { CONDITION: 2 } },
      { text: "議論のマップ（構造図）を描いて見せる", scores: { STRUCTURE: 2 } },
      { text: "今すぐ決定を出さず、一度持ち帰って熟考することを提案する", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 13,
    text: "人の相談に乗っているとき、よく口にするアドバイスは？",
    options: [
      { text: "「で、結局何が一番言いたいの？」", scores: { COMPRESS: 2 } },
      { text: "「具体的なエピソードを一つ教えて？」", scores: { CONCRETE: 2 } },
      { text: "「どういう状況・相手との間で起きたこと？」", scores: { CONTEXT: 2 } },
      { text: "「焦って決めず、もう少し様子を見てみたら？」", scores: { HOLD: 2 } }
    ]
  },
  {
    id: 14,
    text: "指示やアドバイスを受けた際、物足りなさを感じるのはどんなとき？",
    options: [
      { text: "具体的で実用的なアクションが示されていないとき", scores: { CONCRETE: 2 } },
      { text: "適用できる条件や範囲が限定・明確化されていないとき", scores: { CONDITION: 2 } },
      { text: "背景や理由（なぜそれを行うか）が語られていないとき", scores: { CONTEXT: 2 } },
      { text: "話が長すぎて要点がどこにあるか分からないとき", scores: { COMPRESS: 2 } }
    ]
  },
  {
    id: 15,
    text: "プレゼン資料を読むとき、真っ先に視線が向かう部分は？",

      { text: "全体の目次や構成図（アジェンダ）", scores: { STRUCTURE: 2 } },
      { text: "グラフや数値、具体的な事例写真", scores: { CONCRETE: 2 } },
      { text: "注記や前提条件、適用対象の範囲", scores: { CONDITION: 2 } }
    ]

  {
    id: 16,
    text: "新しい概念や理論を学習するとき、定着しやすい理解の仕方は？",

// SCORE_BOUNDS の自動算出
function calculateScoreBounds(questionList) {
    const bounds = {};
    
    Object.values(AXES).forEach(axis => {
        bounds[axis] = { min: 0, max: 0 };
    });

    questionList.forEach(q => {
        Object.values(AXES).forEach(axis => {
            const maxForQuestion = Math.max(
                0,
                ...q.options.map(opt => (opt.scores && opt.scores[axis]) || 0)
            );
            bounds[axis].max += maxForQuestion;
        });
    });

    return bounds;
}

const SCORE_BOUNDS = calculateScoreBounds(questions);

// ==========================================
// 診断処理ロジック
// ==========================================

let currentQuestionIndex = 0;
let rawScores = {};

function initScores() {
    rawScores = {};
    Object.values(AXES).forEach(axis => {
        rawScores[axis] = 0;
    });
}

function startQuiz() {
    initScores();
    currentQuestionIndex = 0;
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestionIndex];
    document.getElementById('question-number').textContent = `質問 ${currentQuestionIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').textContent = q.text;
    
    const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progressPercent}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(opt.scores);
        container.appendChild(btn);
    });
}

function selectOption(scores) {
    Object.entries(scores).forEach(([axis, val]) => {
        if (rawScores[axis] !== undefined) {
            rawScores[axis] += val;
        }
    });

    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function normalizeScores(raw) {
    const normalized = {};
    Object.keys(raw).forEach(axis => {
        const { min, max } = SCORE_BOUNDS[axis];
        if (max === min) {
            normalized[axis] = 0;
        } else {
            const score = Math.max(min, Math.min(max, raw[axis]));
            normalized[axis] = Math.round(((score - min) / (max - min)) * 100);
        }
    });
    return normalized;
}

function analyzeDistribution(normalizedScores) {
    const values = Object.values(normalizedScores);
    const sorted = [...values].sort((a, b) => b - a);
    
    const mean = values.reduce((sum, val) => sum + val, 0) / values.length;
    const variance = values.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / values.length;
    const stdDev = Math.sqrt(variance);
    
    const diffTop1Top2 = sorted[0] - sorted[1];

    if (stdDev > 16 || diffTop1Top2 >= 18) {
        return {
            type: 'PROMINENT',
            label: '特定処理が前に出るプロファイル',
            description: '特定の情報処理スタイルが他の処理より前に出やすく、情報を見る際の入口が比較的はっきりしている傾向があります。'
        };
    } else if (stdDev < 8 && diffTop1Top2 < 10) {
        return {
            type: 'BALANCED',
            label: '複数の処理が近いプロファイル',
            description: '特定の処理だけに偏らず、複数の情報処理スタイルを近い頻度で選択しやすい傾向があります。'
        };
    } else {
        return {
            type: 'MODERATE',
            label: '複数の処理が組み合わさるプロファイル',
            description: '特定の処理がやや前に出つつも、複数の情報処理スタイルが組み合わさって選択されやすい傾向があります。'
        };
    }
}

function generateDiagnosticResult(raw) {
    const normalized = normalizeScores(raw);
    
    const sortedAxes = Object.entries(normalized)
        .sort(([, a], [, b]) => b - a)
        .map(([axis]) => axis);

    const top1 = sortedAxes[0];
    const top2 = sortedAxes[1];

    const distribution = analyzeDistribution(normalized);

    const combinationKey = `${top1}_${top2}`;
    const baseProfile = PROFILE_COMBINATIONS[combinationKey] || getFallbackProfile(top1, top2);

    return {
        scores: normalized,
        primaryAxes: [top1, top2],
        distribution: distribution,
        display: {
            title: `${AXIS_NAMES[top1]} × ${AXIS_NAMES[top2]}`,
            distributionLabel: distribution.label,
            overview: baseProfile.overview + ' ' + distribution.description,
            frequentBehaviors: baseProfile.frequentBehaviors,
            cognitiveCosts: baseProfile.cognitiveCosts
        }
    };
}

let chartInstance = null;

function showResult() {
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const result = generateDiagnosticResult(rawScores);

    document.getElementById('result-title').textContent = result.display.title;
    document.getElementById('result-distribution-tag').textContent = result.display.distributionLabel;
    document.getElementById('result-overview').textContent = result.display.overview;

    // 上位3軸の表示処理（数値のみ表示）
    const sortedAxes = Object.entries(result.scores)
        .sort(([, a], [, b]) => b - a);

    const top3List = document.getElementById('list-top-axes');
    top3List.innerHTML = '';
    sortedAxes.slice(0, 3).forEach(([axis, score]) => {
        const li = document.createElement('li');
        li.textContent = `${AXIS_NAMES[axis]} ${score}`;
        top3List.appendChild(li);
    });

    const frequentList = document.getElementById('list-frequent');
    frequentList.innerHTML = '';
    result.display.frequentBehaviors.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        frequentList.appendChild(li);
    });

    const costsList = document.getElementById('list-costs');
    costsList.innerHTML = '';
    result.display.cognitiveCosts.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        costsList.appendChild(li);
    });

    renderChart(result.scores);
}

function renderChart(normalizedScores) {
    const ctx = document.getElementById('radarChart').getContext('2d');
    
    const labels = [
        AXIS_NAMES[AXES.STRUCTURE],
        AXIS_NAMES[AXES.CONDITION],
        AXIS_NAMES[AXES.CONTEXT],
        AXIS_NAMES[AXES.HOLD],
        AXIS_NAMES[AXES.CONCRETE],
        AXIS_NAMES[AXES.COMPRESS]
    ];

    const dataValues = [
        normalizedScores[AXES.STRUCTURE],
        normalizedScores[AXES.CONDITION],
        normalizedScores[AXES.CONTEXT],
        normalizedScores[AXES.HOLD],
        normalizedScores[AXES.CONCRETE],
        normalizedScores[AXES.COMPRESS]
    ];

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                label: '認知処理の選択傾向 (0-100)',
                data: dataValues,
                backgroundColor: 'rgba(37, 99, 235, 0.2)',
                borderColor: 'rgba(37, 99, 235, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(37, 99, 235, 1)'
            }]
        },
        options: {
            scales: {
                r: {
                    min: 0,
                    max: 100,
                    ticks: {
                        stepSize: 20,
                        display: false
                    },
                    pointLabels: {
                        font: {
                            size: 12
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
}

function resetQuiz() {
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
}
