<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 思考の取扱説明書</title>
    <!-- chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --bar-bg: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 680px;
            width: 100%;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 24px;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #eff6ff;
        }

        /* 結果エリア */
        .hidden {
            display: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .result-distribution-tag {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto 28px auto;
        }

        .section-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-box h3 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .section-box ul, .section-box ol {
            margin: 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .section-box li {
            margin-bottom: 4px;
        }

        .note-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 24px;
            line-height: 1.4;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="screen-quiz">
        <h1>思考の取扱説明書</h1>
        <div class="subtitle">直感で選ぶ20問：あなたの情報処理の「癖」を可視化します</div>

        <div class="progress-container">
            <div class="progress-label">
                <span>進捗</span>
                <span id="progress-text">1 / 20</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div id="question-container">
            <div id="question-text" class="question-title">質問文がここに入ります</div>
            <div id="options-container" class="options-list">
                <!-- 選択肢ボタンが動的に挿入されます -->
            </div>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="hidden">
        <div class="result-header">
            <h2 id="result-title" class="result-title"></h2>
            <div id="result-distribution-tag" class="result-distribution-tag"></div>
            <p id="result-overview" class="description"></p>
        </div>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="section-box">
            <h3>前面に出やすい処理パターン（上位軸）</h3>
            <ol id="list-top-axes" style="font-weight: 600; color: var(--text-main);"></ol>
        </div>

        <div class="section-box">
            <h3>思考の「あるある」傾向</h3>
            <ul id="list-frequent"></ul>
        </div>

        <div class="section-box">
            <h3>モヤッとしやすい場面</h3>
            <ul id="list-costs"></ul>
        </div>

        <p class="note-text">
            ※ この数値は能力の優劣ではなく、用意された設問の中で「どの思考処理を好んで前に出しやすいか」を示す傾向値です。<br>
            ※ 状況や文脈によって出やすい処理は変化します。自分の思考の「取説」としてお楽しみください。
        </p>
        <button class="btn" onclick="resetQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 定数・軸定義
    const AXES = {
        STRUCTURE: "STRUCTURE",
        CONTEXT: "CONTEXT",
        CONDITION: "CONDITION",
        CONCRETE: "CONCRETE",
        COMPRESS: "COMPRESS",
        HOLD: "HOLD"
    };

    const AXIS_NAMES = {
        [AXES.STRUCTURE]: "構造・分類",
        [AXES.CONTEXT]: "背景・感情",
        [AXES.CONDITION]: "条件・ルール",
        [AXES.CONCRETE]: "具体・事例",
        [AXES.COMPRESS]: "要約・本質",
        [AXES.HOLD]: "保留・静観"
    };

    // 質問データ（直感的に選べる軽量20問）
    const QUESTIONS = [
        {
            text: "新しいプロジェクトに参加した時、まず知りたいのは？",
            options: [
                { text: "全体の組み立てや各要素の関係（構造・マップ）", axis: AXES.STRUCTURE },
                { text: "どういう経緯や思いで始まったか（背景・コンテキスト）", axis: AXES.CONTEXT },
                { text: "守るべきルールや前提条件（範囲・制約）", axis: AXES.CONDITION },
                { text: "直近で「誰が何をすればいいか」（具体的な手順）", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "新商品やツールの説明を聞く時、しっくりくるのは？",
            options: [
                { text: "一言で「要するに何ができるか」を短く言われる", axis: AXES.COMPRESS },
                { text: "実際に使っている人の具体的な体験談を聞く", axis: AXES.CONCRETE },
                { text: "メニューや機能の全体像（分類一覧）を見る", axis: AXES.STRUCTURE },
                { text: "焦らず、他人の評判や事例が出揃うまで様子を見る", axis: AXES.HOLD }
            ]
        },
        {
            text: "話が脱線したり散らかったりした時、頭の中でやりがちなのは？",
            options: [
                { text: "「今の話は本題のどの箱に入るか」整理する", axis: AXES.STRUCTURE },
                { text: "「なぜ急にこの話を始めたのかな」と意図を察する", axis: AXES.CONTEXT },
                { text: "「要するに結論は何？」と頭で要約する", axis: AXES.COMPRESS },
                { text: "「まあ、もう少し状況を観察しよう」と静観する", axis: AXES.HOLD }
            ]
        },
        {
            text: "複雑な課題に直面した時、真っ先にとるアプローチは？",
            options: [
                { text: "要素をいくつかのアタッチメントに分解・分類する", axis: AXES.STRUCTURE },
                { text: "前提条件やルールを再確認する", axis: AXES.CONDITION },
                { text: "過去の似たような concrete 事例を探す", axis: AXES.CONCRETE },
                { text: "一瞬立ち止まり、情報が集まるまで保留にする", axis: AXES.HOLD }
            ]
        },
        {
            text: "「わかりやすい説明だな」と感じる人の特徴は？",
            options: [
                { text: "無駄な話を削ぎ落とし、ポイントを一言で言える", axis: AXES.COMPRESS },
                { text: "具体的なエピソードや例え話を出してくれる", axis: AXES.CONCRETE },
                { text: "前提や例外の条件をキッチリ分けてくれる", axis: AXES.CONDITION },
                { text: "背景のストーリーや関わる人の心情を語ってくれる", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "メールやチャットを書く時、一番意識することは？",
            options: [
                { text: "箇条書きや見出しで読みやすく構造化する", axis: AXES.STRUCTURE },
                { text: "結論から書き始め、とにかく短くまとめる", axis: AXES.COMPRESS },
                { text: "相手の立場や気持ち（配慮）を文脈に込める", axis: AXES.CONTEXT },
                { text: "適用範囲や誤解を防ぐ条件を明確に書く", axis: AXES.CONDITION }
            ]
        },
        {
            text: "相談に乗っている時、無意識に出やすい行動は？",
            options: [
                { text: "「要するに一番の課題はここだね」と核心を絞る", axis: AXES.COMPRESS },
                { text: "そこに至った経緯や気持ちを親身にじっくり聞く", axis: AXES.CONTEXT },
                { text: "「具体的にどんな出来事があった？」と例を聞く", axis: AXES.CONCRETE },
                { text: "すぐにアドバイスせず、出し切るまで静かに待つ", axis: AXES.HOLD }
            ]
        },
        {
            text: "ニュースや記事を読むとき、真っ先に目が行くのは？",
            options: [
                { text: "一言でわかるタイトルや要約サマリー", axis: AXES.COMPRESS },
                { text: "実際に影響を受けた人の具体的な体験談", axis: AXES.CONCRETE },
                { text: "その出来事が起きた時代的背景や関係性", axis: AXES.CONTEXT },
                { text: "全体像やデータがまとまった図解・インフォグラフィック", axis: AXES.STRUCTURE }
            ]
        },
        {
            text: "決断に迷ったり保留したくなったりする理由は？",
            options: [
                { text: "判断基準や前提ルール（条件）がブレている時", axis: AXES.CONDITION },
                { text: "まだ情報が足りず、今すぐ決める必要性を感じない時", axis: AXES.HOLD },
                { text: "全体の構造や将来のロードマップが見えない時", axis: AXES.STRUCTURE },
                { text: "関わる人の納得感や感情が置き去りになっている時", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "仕事でストレスを感じやすいのはどんな場面？",
            options: [
                { text: "役割や整理がぐちゃぐちゃでカオスな状態", axis: AXES.STRUCTURE },
                { text: "理由や背景が一切語られず単発で指示される時", axis: AXES.CONTEXT },
                { text: "根拠もないのに「今すぐノリで決めて」と急かされる時", axis: AXES.HOLD },
                { text: "具体的な行動が見えず、抽象的な議論が延々と続く時", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "自分の意見をまとめる時の「着地点」はどこ？",
            options: [
                { text: "頭の中の要素がキレイに図解・分類できた時", axis: AXES.STRUCTURE },
                { text: "「要するに〇〇だ」とワンフレーズに凝縮できた時", axis: AXES.COMPRESS },
                { text: "「〇〇ならA、〇〇ならB」と分岐ルールができた時", axis: AXES.CONDITION },
                { text: "自分の中で背景のストーリーが腑に落ちた時", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "周囲から依頼されがちな役割は？",
            options: [
                { text: "散らかった情報や会議内容をクリアに整理すること", axis: AXES.STRUCTURE },
                { text: "長い文章や複雑な話を短い要点にまとめること", axis: AXES.COMPRESS },
                { text: "「このケースはどうする？」と抜け漏れや条件を点検すること", axis: AXES.CONDITION },
                { text: "慌てず状況を冷静に観察・静観すること", axis: AXES.HOLD }
            ]
        },
        {
            text: "議論で噛み合わない時に「足りない」と感じるものは？",
            options: [
                { text: "「全体で何を話しているか」の構造枠組み", axis: AXES.STRUCTURE },
                { text: "「どういう前提（条件）での話か」というベース", axis: AXES.CONDITION },
                { text: "「具体的にどういうことか」という実践例", axis: AXES.CONCRETE },
                { text: "一言で表す核心メッセージ", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "本を読むとき、一番最初や頻繁にチェックする場所は？",
            options: [
                { text: "目次や体系図を見て、全体の構成を掴む", axis: AXES.STRUCTURE },
                { text: "「はじめに」で著者の想いや背景を読む", axis: AXES.CONTEXT },
                { text: "見出しや要約部分だけを拾い読みする", axis: AXES.COMPRESS },
                { text: "一気に読まず、自分のペースで立ち止まりながら読む", axis: AXES.HOLD }
            ]
        },
        {
            text: "人と意見が対立した時、どうアプローチする？",
            options: [
                { text: "双方の意見のズレを可視化して整理する", axis: AXES.STRUCTURE },
                { text: "相手がなぜそう考えるに至ったか背景を聴く", axis: AXES.CONTEXT },
                { text: "「こういう条件ならOKか」とルールを探る", axis: AXES.CONDITION },
                { text: "1つ具体的な妥協案（事例）を作って示してみる", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "予期せぬ変更が発生した時、最初のリアクションは？",
            options: [
                { text: "「どの範囲に影響が出るか」構造的に確認する", axis: AXES.STRUCTURE },
                { text: "「なぜ変更になったのか」背景を聞く", axis: AXES.CONTEXT },
                { text: "慌てずに落ち着くまで様子を見る", axis: AXES.HOLD },
                { text: "「で、具体的に今日何を変えればいい？」と行動を聞く", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "「この人仕事やりやすいな」と感じるタイプは？",
            options: [
                { text: "整理整頓が得意で、話が論理的に整理されている人", axis: AXES.STRUCTURE },
                { text: "要点だけを短く伝えてくれて無駄のない人", axis: AXES.COMPRESS },
                { text: "こちらの意図や状況（文脈）を理解してくれる人", axis: AXES.CONTEXT },
                { text: "約束や前提条件をきっちり守ってくれる人", axis: AXES.CONDITION }
            ]
        },
        {
            text: "アイデアや解決策を考える時の得意なスタイルは？",
            options: [
                { text: "既存の要素を組み替えて新しい構造を作ること", axis: AXES.STRUCTURE },
                { text: "人の想いや情緒的なニーズに響く切り口を出すこと", axis: AXES.CONTEXT },
                { text: "「もし〇〇という条件なら」と前提を置くこと", axis: AXES.CONDITION },
                { text: "実際にある具体例や成功パターンを応用すること", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "長時間の会議で頭に浮かびがちな思考は？",
            options: [
                { text: "「今の話、議論のマップで言うとどこ？」", axis: AXES.STRUCTURE },
                { text: "「一旦持ち帰って冷静に検討した方がよくない？」", axis: AXES.HOLD },
                { text: "「発言の裏にあるみんなの意図は何だろう」", axis: AXES.CONTEXT },
                { text: "「要するに、結局何が決まったの？」", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "自分の思考の「立ち位置」に一番近いものは？",
            options: [
                { text: "複雑なものを整理するデザイナー", axis: AXES.STRUCTURE },
                { text: "無駄を削ぎ落とす彫刻家", axis: AXES.COMPRESS },
                { text: "背景にあるストーリーを汲み取るナビゲーター", axis: AXES.CONTEXT },
                { text: "静かに全体を見分ける観察者", axis: AXES.HOLD }
            ]
        }
    ];

    // プロファイル定義
    const PROFILE_COMBINATIONS = {
        [`${AXES.STRUCTURE}_${AXES.CONDITION}`]: {
            title: "「整頓された設計図を求める」クラフトマン傾向",
            overview: "全体像と条件・ルールをクリアにしていく整理の達人。『まず枠組みと条件をしっかり把握したい』という慎重で堅実な思考スタイルです。",
            frequentBehaviors: [
                "「で、全体で何をしようとしてるんだっけ？」と確認したくなる",
                "頭の中で勝手に箇条書きや枠組みを作って話を整理している",
                "「それってどういう例外条件のときの話？」と抜け漏れにすぐ気づく"
            ],
            cognitiveCosts: [
                "「ノリでイイ感じにして！」と丸投げされたとき",
                "前提やルールがブレまくっている打ち合わせ",
                "仕組みがない状態でのぶっつけ本番"
            ]
        },
        [`${AXES.STRUCTURE}_${AXES.CONTEXT}`]: {
            title: "「ストーリーを描き切る」ナビゲーター傾向",
            overview: "全体像の組み立てだけでなく『なぜそれをするのか』の背景や情緒を大切にするスタイル。文脈を組み込んだ納得感のある整理が得意です。",
            frequentBehaviors: [
                "「どういう経緯でこの話になったの？」と背景を聞きたがる",
                "バラバラな出来事を「要するにこういう流れだよね」と繋ぎ合わせる",
                "相手の感情に配慮しながら整理された提案ができる"
            ],
            cognitiveCosts: [
                "背景の説明がゼロで、単発の作業だけ投げられたとき",
                "人の気持ちを無視して、数字だけでバッサリ決められる瞬間",
                "脈絡のない指示が次々と飛んでくる環境"
            ]
        },
        [`${AXES.CONDITION}_${AXES.HOLD}`]: {
            title: "「リスクを見逃さない」鑑定士傾向",
            overview: "条件をしっかり見極め、納得がいくまで焦って結論を出さない冷静な思考スタイル。『一旦持ち帰って落ち着いて考える』が強みです。",
            frequentBehaviors: [
                "「まだ情報が足りないな」と感じたら焦らず静観できる",
                "うまい話を聞いたとき、真っ先に「裏の条件やリスクは？」と探る",
                "トラブル時ほど一歩引いて「で、何が起きてる？」と冷着になれる"
            ],
            cognitiveCosts: [
                "根拠がないのに「今すぐ直感で決めて！」と詰められる場面",
                "ノリと勢いだけで怪しい話が進んでいく空間",
                "じっくり検証する時間を奪われること"
            ]
        },
        [`${AXES.COMPRESS}_${AXES.CONCRETE}`]: {
            title: "「本質を即スナイプする」実践派リアリスト傾向",
            overview: "『要するに何？』と『具体的にどう動く？』を素早く結びつける超実践派。無駄な長話をカットし、スピーディーに動きたいスタイルです。",
            frequentBehaviors: [
                "長すぎる説明を読むと無意識に「結論はどこ？」と探す",
                "抽象論より「たとえばどんな例がある？」と具体例で理解する",
                "複雑な話を一言のフレーズに要約するのが得意"
            ],
            cognitiveCosts: [
                "結論がなかなか見えないダラダラした会議",
                "「具体的にどう動くか」が見えないフワッとした話",
                "前置きや形容詞が多すぎる長い説明"
            ]
        }
    };

    function getFallbackProfile(top1, top2) {
        return {
            title: `「${AXIS_NAMES[top1]} × ${AXIS_NAMES[top2]}」バランス傾向`,
            overview: `【${AXIS_NAMES[top1]}】の視点と【${AXIS_NAMES[top2]}】の視点を切り替えながら柔軟に情報処理を行うスタイルです。`,
            frequentBehaviors: [
                `まず【${AXIS_NAMES[top1]}】の観点から状況をピンポイントで捉える`,
                `必要に応じて【${AXIS_NAMES[top2]}】の視点を足して理解を深める`
            ],
            cognitiveCosts: [
                `得意な【${AXIS_NAMES[top1]}】や【${AXIS_NAMES[top2]}】のアプローチが使えない極端な環境`
            ]
        };
    }

    // 状態管理変数
    let currentQuestionIndex = 0;
    let scores = {
        [AXES.STRUCTURE]: 0,
        [AXES.CONTEXT]: 0,
        [AXES.CONDITION]: 0,
        [AXES.CONCRETE]: 0,
        [AXES.COMPRESS]: 0,
        [AXES.HOLD]: 0
    };
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        showQuestion(currentQuestionIndex);
    });

    function showQuestion(index) {
        const q = QUESTIONS[index];
        document.getElementById("question-text").innerText = `Q${index + 1}. ${q.text}`;
        
        const progressPercent = ((index + 1) / QUESTIONS.length) * 100;
        document.getElementById("progress-fill").style.width = `${progressPercent}%`;
        document.getElementById("progress-text").innerText = `${index + 1} / ${QUESTIONS.length}`;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.axis);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(axis) {
        scores[axis] = (scores[axis] || 0) + 1;
        currentQuestionIndex++;

        if (currentQuestionIndex < QUESTIONS.length) {
            showQuestion(currentQuestionIndex);
        } else {
            showResult();
        }
    }

    // スコアの偏り（標準偏差）判定
    function calculateDistribution(scoresValues) {
        const mean = scoresValues.reduce((a, b) => a + b, 0) / scoresValues.length;
        const variance = scoresValues.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / scoresValues.length;
        const stdDev = Math.sqrt(variance);

        // 0〜100スケールにおける判定閾値
        if (stdDev >= 12) {
            return {
                label: "くっきり・特化タイプ",
                description: "特定の情報処理アプローチを明確に好むスタイルです。得意な環境で抜群のキレを発揮します。"
            };
        } else if (stdDev <= 5) {
            return {
                label: "バランス・オールラウンドタイプ",
                description: "状況や相手に合わせて多角的に頭を切り替えられる柔軟なスタイルです。"
            };
        } else {
            return {
                label: "ハイブリッドタイプ",
                description: "特定の得意領域を持ちつつ、周囲の状況に応じて柔軟に対応できるバランス型です。"
            };
        }
    }

    function generateDiagnosticResult(rawScores) {
        const totalAnswers = QUESTIONS.length;
        
        // 素直に0〜100%（選択割合）を算出
        const normalized = {};
        for (const axis in rawScores) {
            normalized[axis] = Math.round((rawScores[axis] / totalAnswers) * 100);
        }

        const sortedAxes = Object.keys(rawScores).sort((a, b) => rawScores[b] - rawScores[a]);
        const top1 = sortedAxes[0];
        const top2 = sortedAxes[1];

        const comboKey1 = `${top1}_${top2}`;
        const comboKey2 = `${top2}_${top1}`;
        const baseProfile = PROFILE_COMBINATIONS[comboKey1] || PROFILE_COMBINATIONS[comboKey2] || getFallbackProfile(top1, top2);

        const scoresValues = Object.values(normalized);
        const distribution = calculateDistribution(scoresValues);

        return {
            scores: normalized,
            primaryAxes: [top1, top2, sortedAxes[2]],
            distribution: distribution,
            display: {
                title: baseProfile.title,
                distributionLabel: distribution.label,
                overview: baseProfile.overview + ' ' + distribution.description,
                frequentBehaviors: baseProfile.frequentBehaviors,
                cognitiveCosts: baseProfile.cognitiveCosts
            }
        };
    }

    function showResult() {
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-result").classList.remove("hidden");

        const result = generateDiagnosticResult(scores);

        document.getElementById("result-title").innerText = result.display.title;
        document.getElementById("result-distribution-tag").innerText = result.display.distributionLabel;
        document.getElementById("result-overview").innerText = result.display.overview;

        const topAxesList = document.getElementById("list-top-axes");
        topAxesList.innerHTML = "";
        result.primaryAxes.forEach(axis => {
            const li = document.createElement("li");
            li.innerText = `${AXIS_NAMES[axis]} (${result.scores[axis]}%)`;
            topAxesList.appendChild(li);
        });

        const frequentList = document.getElementById("list-frequent");
        frequentList.innerHTML = "";
        result.display.frequentBehaviors.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            frequentList.appendChild(li);
        });

        const costsList = document.getElementById("list-costs");
        costsList.innerHTML = "";
        result.display.cognitiveCosts.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            costsList.appendChild(li);
        });

        renderChart(result.scores);
    }

    function renderChart(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        const labels = Object.keys(AXES).map(key => AXIS_NAMES[key]);
        const dataValues = Object.keys(AXES).map(key => scores[key]);

        chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: '思考処理の割合 (%)',
                    data: dataValues,
                    backgroundColor: 'rgba(37, 99, 235, 0.25)',
                    borderColor: 'rgba(37, 99, 235, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(37, 99, 235, 1)',
                    pointRadius: 4
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        min: 0,
                        max: 50, // 6軸で現実的に出現する最大割合に合わせたスケール
                        ticks: {
                            stepSize: 10,
                            display: false
                        }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        scores = {
            [AXES.STRUCTURE]: 0,
            [AXES.CONTEXT]: 0,
            [AXES.CONDITION]: 0,
            [AXES.CONCRETE]: 0,
            [AXES.COMPRESS]: 0,
            [AXES.HOLD]: 0
        };
        document.getElementById("screen-result").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        showQuestion(0);
    }
</script>

</body>
</html>
