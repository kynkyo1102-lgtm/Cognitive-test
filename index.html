<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>認知スタイル診断 | 30問でわかる情報処理プロファイル</title>
    <!-- chart.js (レーダーチャート描画用) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --bar-bg: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 680px;
            width: 100%;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 24px;
        }

        /* プログレスバー */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 8px;
            background-color: var(--bar-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 質問エリア */
        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background-color: #eff6ff;
        }

        /* 結果エリア */
        .hidden {
            display: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .result-distribution-tag {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 32px auto;
        }

        .section-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-box h3 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .section-box ul, .section-box ol {
            margin: 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .section-box li {
            margin-bottom: 4px;
        }

        .note-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 24px;
            line-height: 1.4;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 診断画面 -->
    <div id="screen-quiz">
        <h1>認知スタイル診断</h1>
        <div class="subtitle">日常生活や仕事での「情報の受け取り方・考え方」を可視化します（全30問）</div>

        <div class="progress-container">
            <div class="progress-label">
                <span>進捗</span>
                <span id="progress-text">1 / 30</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div id="question-container">
            <div id="question-text" class="question-title">質問文がここに入ります</div>
            <div id="options-container" class="options-list">
                <!-- 選択肢ボタンが動的に挿入されます -->
            </div>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="hidden">
        <div class="result-header">
            <h2 id="result-title" class="result-title"></h2>
            <div id="result-distribution-tag" class="result-distribution-tag"></div>
            <p id="result-overview" class="description"></p>
        </div>

        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>

        <div class="section-box">
            <h3>主に出やすい処理（上位3軸）</h3>
            <ol id="list-top-axes" style="font-weight: 600; color: var(--text-main);"></ol>
        </div>

        <div class="section-box">
            <h3>あなたの思考の「あるある」特徴</h3>
            <ul id="list-frequent"></ul>
        </div>

        <div class="section-box">
            <h3>こんな場面、ちょっとモヤッとするかも？</h3>
            <ul id="list-costs"></ul>
        </div>

        <p class="note-text">
            ※ 0〜100の数値は能力の優劣や全体平均との比較（偏差値）ではなく、この診断で用意された選択肢の中で「その情報処理をどの程度の割合で選択したか」を表す傾向値です。<br>
            ※ 本診断は個人の思考の癖や好みを可視化するものであり、能力の適性を特定するものではありません。
        </p>
        <button class="btn" onclick="resetQuiz()">もう一度診断する</button>
    </div>
</div>

<script>
    // 定数・軸定義
    const AXES = {
        STRUCTURE: "STRUCTURE",
        CONTEXT: "CONTEXT",
        CONDITION: "CONDITION",
        CONCRETE: "CONCRETE",
        COMPRESS: "COMPRESS",
        HOLD: "HOLD"
    };

    const AXIS_NAMES = {
        [AXES.STRUCTURE]: "構造・分類",
        [AXES.CONTEXT]: "背景・感情",
        [AXES.CONDITION]: "条件・ルール",
        [AXES.CONCRETE]: "具体・エピソード",
        [AXES.COMPRESS]: "要約・本質",
        [AXES.HOLD]: "保留・静観"
    };

    // 質問データ（全30問）
    const QUESTIONS = [
        {
            text: "仕事やプロジェクトの「全体の流れ」を把握したい時、まず確認したいのは？",
            options: [
                { text: "全体の分類や、各要素の構造・関係性（マップや図解など）", axis: AXES.STRUCTURE },
                { text: "その企画が立ち上がった経緯や背景、関わる人の思い", axis: AXES.CONTEXT },
                { text: "どのような条件・前提のもとで進めるべきかというルール", axis: AXES.CONDITION },
                { text: "具体的に『明日何をするのか』という行動レベルの例", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "新しいツールやソフトを使い始める時、どうアプローチする？",
            options: [
                { text: "メニュー構造や設定項目を一通り見て、全体像を理解する", axis: AXES.STRUCTURE },
                { text: "一言で言うと『何ができるツールなのか』の要点を把握する", axis: AXES.COMPRESS },
                { text: "まずは使わずに、他人の評判や実際の使用例をもう少し観察する", axis: AXES.HOLD },
                { text: "実際に1つの作業を具体的に試しながら覚える", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "会議や雑談で話が脱線した時、頭の中で考えていることは？",
            options: [
                { text: "「今の話は、本題のどの部分に紐づく話だろう？」と分類する", axis: AXES.STRUCTURE },
                { text: "「なぜこの人は急にこの話をし始めたんだろう？」と背景を察する", axis: AXES.CONTEXT },
                { text: "「脱線してもいい条件（時間的余裕など）はあるか」を気にする", axis: AXES.CONDITION },
                { text: "「要するに結論は何？」と頭の中でまとめ直す", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "複雑な問題が発生したとき、真っ先に取り取る行動は？",
            options: [
                { text: "情報を整理し、要因をいくつかのカテゴリーに分解する", axis: AXES.STRUCTURE },
                { text: "焦って決めず、一旦状況を静観して情報を集める", axis: AXES.HOLD },
                { text: "何がOKで何がNGか、適用されるルールや条件を確認する", axis: AXES.CONDITION },
                { text: "過去に似たような具体事例がなかったかを思い出す", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "説明上手な人だと感じるのは、どんな話し手？",
            options: [
                { text: "長文でも、短く一言で本質をズバッとまとめてくれる人", axis: AXES.COMPRESS },
                { text: "具体的なエピソードや体験談を交えて話してくれる人", axis: AXES.CONCRETE },
                { text: "「ここまでは前提条件、ここからは例外」と明確に分けてくれる人", axis: AXES.CONDITION },
                { text: "なぜその結論に至ったのか、ストーリーや感情の背景を語る人", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "文章を書く時（メールや報告書など）、意識して心がけていることは？",
            options: [
                { text: "箇条書きや見出しを使い、整理された構造にすること", axis: AXES.STRUCTURE },
                { text: "要点を冒頭に書き、短くシンプルに仕上げること", axis: AXES.COMPRESS },
                { text: "読み手がどう感じるか、相手の文脈や感情に配慮すること", axis: AXES.CONTEXT },
                { text: "誤解のないよう、適用範囲や例外条件を明記すること", axis: AXES.CONDITION }
            ]
        },
        {
            text: "誰かから悩みを相談されたとき、自然ととりやすいスタンスは？",
            options: [
                { text: "「要するに一番の問題はここだね」と核心をまとめてあげる", axis: AXES.COMPRESS },
                { text: "相手がそう感じるに至った経緯や気持ちを親身に聴く", axis: AXES.CONTEXT },
                { text: "「具体的にどんなことが起きたの？」と事例を聞く", axis: AXES.CONCRETE },
                { text: "すぐにアドバイスせず、相手の話をひと通り出し切るまで静かに待つ", axis: AXES.HOLD }
            ]
        },
        {
            text: "スケジュールや予定を立てる時、一番しっくりくる方法は？",
            options: [
                { text: "枠組みやカテゴリ（仕事・プライベート・学びなど）に分けて配置する", axis: AXES.STRUCTURE },
                { text: "「〇〇の場合は延期」といった条件付きのルールを決めておく", axis: AXES.CONDITION },
                { text: "具体的な時間刻みで、実際の行動イメージを細かく書き出す", axis: AXES.CONCRETE },
                { text: "あまりガチガチに決めず、状況が変わるまで保留の枠を残しておく", axis: AXES.HOLD }
            ]
        },
        {
            text: "ニュースや記事を読むとき、惹かれやすい部分は？",
            options: [
                { text: "一言でポイントがわかるタイトルや要約サマリー", axis: AXES.COMPRESS },
                { text: "実際に被害や影響を受けた個人のインタビュー・体験談", axis: AXES.CONCRETE },
                { text: "その出来事が起きた時代背景や、社会的なコンテキスト", axis: AXES.CONTEXT },
                { text: "データや図解で全体像がまとめられたインフォグラフィック", axis: AXES.STRUCTURE }
            ]
        },
        {
            text: "意思決定をしなければならない時、判断に困る理由は？",
            options: [
                { text: "判断基準やルール（条件）が曖昧なとき", axis: AXES.CONDITION },
                { text: "まだ十分な材料が揃っておらず、今決める必要性を感じないとき", axis: AXES.HOLD },
                { text: "全体像や将来的な構造が見えていないとき", axis: AXES.STRUCTURE },
                { text: "関わる人々の気持ちや納得感が置き去りになっているとき", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "セミナーや研修に参加したとき、満足度が高くなるのはどんな内容？",
            options: [
                { text: "複雑な概念が、体系的なモデルやチャートに整理されている", axis: AXES.STRUCTURE },
                { text: "今日からすぐに現場で使える「具体的な手順・事例」が多い", axis: AXES.CONCRETE },
                { text: "無駄な解説がなく、重要ポイントだけが提示される", axis: AXES.COMPRESS },
                { text: "講師や参加者の想い、背景にあるストーリーに触れられる", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "議論が噛み合っていないと感じる時、足りないと思うものは？",
            options: [
                { text: "「そもそも何の話をしているか」という全体のフレームワーク", axis: AXES.STRUCTURE },
                { text: "「どんな条件の時の話か」という前提のすり合わせ", axis: AXES.CONDITION },
                { text: "抽象論ばかりでなく、「具体的にどういうことか」という例示", axis: AXES.CONCRETE },
                { text: "話の核心となる「一言の要点」", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "自分自身の「考えがまとまった」と感じる瞬間はどんな時？",
            options: [
                { text: "頭の中の要素がキレイに分類・整理できた時", axis: AXES.STRUCTURE },
                { text: "複雑な話が「要するに〇〇だ」とワンフレーズで表現できた時", axis: AXES.COMPRESS },
                { text: "「こうなったらこうする」という分岐ルールが完成した時", axis: AXES.CONDITION },
                { text: "自分の中で感情や背景のストーリーが腑に落ちた時", axis: AXES.CONTEXT }
            ]
        },
        {
            text: "周囲から頼まれることが多い役割は？",
            options: [
                { text: "散らかった議論や資料を、見やすく整理・分類すること", axis: AXES.STRUCTURE },
                { text: "長文や複雑な資料を、短い要点にまとめること", axis: AXES.COMPRESS },
                { text: "「こういうケースはどうする？」と抜け漏れや条件をチェックすること", axis: AXES.CONDITION },
                { text: "状況を冷静に見守り、静かに状況を観察・判断すること", axis: AXES.HOLD }
            ]
        },
        {
            text: "他人の意見を聞いていて「少し受け入れがたい」と感じるのは？",
            options: [
                { text: "論理の飛躍があり、全体の構造から浮いている意見", axis: AXES.STRUCTURE },
                { text: "背景や経緯を無視した、冷酷で思いやりのない意見", axis: AXES.CONTEXT },
                { text: "前提条件やルールを無視した、極端な意見", axis: AXES.CONDITION },
                { text: "抽象的すぎて、現実の行動や事例が何もイメージできない意見", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "本や読書をする際のスタイルの特徴は？",
            options: [
                { text: "目次や体系を見て、全体の構成を掴んでから読む", axis: AXES.STRUCTURE },
                { text: "「はじめに」や「おわりに」を読み、著者の想いや背景を知る", axis: AXES.CONTEXT },
                { text: "要約サイトや見出しだけを追い、要点だけを短時間で掴む", axis: AXES.COMPRESS },
                { text: "一気に結論を出さず、じっくり時間をかけて考えながら読む", axis: AXES.HOLD }
            ]
        },
        {
            text: "仕事でストレスを感じやすい場面はどれ？",
            options: [
                { text: "役割分担や構造があやふやで、カオスな状態のとき", axis: AXES.STRUCTURE },
                { text: "理由や背景が説明されず、単発の指示だけが飛んでくるとき", axis: AXES.CONTEXT },
                { text: "根拠がないのに「今すぐ直感で決めて」と判断を急かされるとき", axis: AXES.HOLD },
                { text: "具体例がなく、概念的なフワッとした話ばかりが続くとき", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "新しい企画やアイデアを出す時、重視するアプローチは？",
            options: [
                { text: "既存の要素を分解し、新しい組み合わせの構造を作ること", axis: AXES.STRUCTURE },
                { text: "誰のどんな感情や背景（コンテキスト）に響くかを考えること", axis: AXES.CONTEXT },
                { text: "「もし〇〇という条件なら」と、仮説の前提を立てること", axis: AXES.CONDITION },
                { text: "実際の成功事例や、具体的なプロトタイプを提示すること", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "記憶に残る「良い思い出」の残り方は？",
            options: [
                { text: "いつ、どこで、誰と…といった分類された整理データとして残る", axis: AXES.STRUCTURE },
                { text: "その時の空気感や、関わった人との情緒的なストーリーとして残る", axis: AXES.CONTEXT },
                { text: "具体的なエピソードや、印象的な言葉・出来事の場面で残る", axis: AXES.CONCRETE },
                { text: "一言で表すなら「〇〇な年だった」というキャッチコピーで残る", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "会議で意見を求められたとき、よく使うフレーズは？",
            options: [
                { text: "「要するに、核心は〇〇ということですよね」", axis: AXES.COMPRESS },
                { text: "「具体的には、どのような事例を想定していますか？」", axis: AXES.CONCRETE },
                { text: "「どういう経緯でこの案になったか、背景を聞けますか？」", axis: AXES.CONTEXT },
                { text: "「もう少し材料が出揃うまで、様子を見ませんか？」", axis: AXES.HOLD }
            ]
        },
        {
            text: "買い物をするとき（家電や服など）、決め手になりやすいのは？",
            options: [
                { text: "スペックや機能の比較表（分類・構造）を見て納得すること", axis: AXES.STRUCTURE },
                { text: "開発者の想いや、ブランドのストーリーに共感すること", axis: AXES.CONTEXT },
                { text: "「保証期間が〇年なら買う」といった自分なりの条件に合うこと", axis: AXES.CONDITION },
                { text: "「実際に使っている人の具体レビュー」を見ること", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "自分の強み（思考のクセ）を一言で表すなら？",
            options: [
                { text: "情報をクリアに整理・整理統合できること", axis: AXES.STRUCTURE },
                { text: "本質を素早く一言に絞り込めること", axis: AXES.COMPRESS },
                { text: "物事の前提条件や見落としがちなリスクに気づけること", axis: AXES.CONDITION },
                { text: "感情に流されず、状況を冷静に観察し続けられること", axis: AXES.HOLD }
            ]
        },
        {
            text: "誰かと意見が対立したとき、解決のためにどう振る舞う？",
            options: [
                { text: "対立点を可視化し、どこがズレているかを構造的に整理する", axis: AXES.STRUCTURE },
                { text: "相手がなぜその意見を持つに至ったか、背景や想いを聴く", axis: AXES.CONTEXT },
                { text: "「こういう条件なら妥協できるか」というルールを探る", axis: AXES.CONDITION },
                { text: "お互いが納得できる「具体的な解決例」を1つ提示してみる", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "複雑な作業手順を教わるとき、一番ありがたい教わり方は？",
            options: [
                { text: "全体像がわかるフローチャートを見せてもらう", axis: AXES.STRUCTURE },
                { text: "「一言で言うと何をする作業か」の目的を教えてもらう", axis: AXES.COMPRESS },
                { text: "講師が実際にやって見せる具体例を見せてもらう", axis: AXES.CONCRETE },
                { text: "「〇〇の時はA、〇〇の時はB」という条件分岐を明確にしてもらう", axis: AXES.CONDITION }
            ]
        },
        {
            text: "予期せぬ変更やトラブルが発生した時、最初の反応は？",
            options: [
                { text: "「どの部分に影響が出るか」を構造的にチェックする", axis: AXES.STRUCTURE },
                { text: "「変更に至った背景には何があったのか」を確認する", axis: AXES.CONTEXT },
                { text: "あわてて動かず、状況が落ち着くまで静観・情報収集する", axis: AXES.HOLD },
                { text: "「で、具体的に今何を変更すればいい？」と直近の行動を確認する", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "「あの人とは仕事（コミュニケーション）がやりやすい」と感じる相手は？",
            options: [
                { text: "整理整頓が得意で、話が論理的に整理されている人", axis: AXES.STRUCTURE },
                { text: "結論から話してくれて、無駄な長話がない人", axis: AXES.COMPRESS },
                { text: "こちらの意図や状況（文脈）を察してくれる人", axis: AXES.CONTEXT },
                { text: "約束事やルール（条件）をキッチリ守ってくれる人", axis: AXES.CONDITION }
            ]
        },
        {
            text: "情報を誰かに伝達する時、自分がやりがちな傾向は？",
            options: [
                { text: "図や箇条書きを使い、関係性をわかりやすく整えてしまう", axis: AXES.STRUCTURE },
                { text: "「結論から言うと〇〇です」と短くまとめてしまう", axis: AXES.COMPRESS },
                { text: "「例えば〇〇さんのケースだと…」と具体例を入れてしまう", axis: AXES.CONCRETE },
                { text: "「これは〇〇の場合に限ります」と注記や条件をつけてしまう", axis: AXES.CONDITION }
            ]
        },
        {
            text: "何かについて深くリサーチする時、納得がいく着地点は？",
            options: [
                { text: "全体像を網羅したフレームワークが完成した時", axis: AXES.STRUCTURE },
                { text: "「核心となるメッセージ」を一言に抽出できた時", axis: AXES.COMPRESS },
                { text: "例外のないしっかりとした原則・条件が見つかった時", axis: AXES.CONDITION },
                { text: "生データや具体的な事実・エピソードが集まった時", axis: AXES.CONCRETE }
            ]
        },
        {
            text: "長時間の会議に出ている時、頭の中で考えていることは？",
            options: [
                { text: "「今の意見は、マトリクスのどこに位置づけられるか」", axis: AXES.STRUCTURE },
                { text: "「そろそろ話を保留にして、次回に回したほうがいいのでは」", axis: AXES.HOLD },
                { text: "「みんな発言背景にどんな意図があるんだろう」", axis: AXES.CONTEXT },
                { text: "「で、結局1行でまとめると何が決まったの？」", axis: AXES.COMPRESS }
            ]
        },
        {
            text: "自分自身の「思考のスタンス」に一番近いと感じるものは？",
            options: [
                { text: "複雑なものを、整理して見やすくするデザイナー", axis: AXES.STRUCTURE },
                { text: "無駄を削ぎ落とし、核心を取り出す彫刻家", axis: AXES.COMPRESS },
                { text: "背景にあるストーリーや想いを紡ぐナビゲーター", axis: AXES.CONTEXT },
                { text: "安易に飛びつかず、じっくり様子を見る観察者", axis: AXES.HOLD }
            ]
        }
    ];

    // タイプごとの定義（組み合わせプロファイル）
    const PROFILE_COMBINATIONS = {
        [`${AXES.STRUCTURE}_${AXES.CONDITION}`]: {
            title: "「整頓された設計図を求める」クラフトマンタイプ",
            overview: "いきなり走るよりも『まず全体像とルールを完璧に把握したい』慎重派の職人さん。複雑な状況でも、頭の中でサクサク箱分けしてクリアにしていく整理の達人です。",
            frequentBehaviors: [
                "「で、結局全体で何をしようとしてるんだっけ？」と定期的に確認したくなる",
                "話を聞きながら、頭の中で勝手に箇条書きやマインドマップを作っている",
                "「それってどういう例外条件のときの話？」と抜け漏れをすぐ見つける"
            ],
            cognitiveCosts: [
                "「理由はいいからノリでイイ感じにして！」と丸投げされたとき",
                "前提やゴールがころころ変わって、軸がブレまくっている会議",
                "仕組みやルールが整っていないカオスな状態でのぶっつけ本番"
            ]
        },
        [`${AXES.STRUCTURE}_${AXES.CONTEXT}`]: {
            title: "「ストーリーを描き切る」ナビゲータータイプ",
            overview: "全体的な組み立てだけでなく、『なぜそれをするのか』という背景や感情のストーリーをとても大切にするタイプ。チームの方向性を優しく指し示す司令塔です。",
            frequentBehaviors: [
                "「どういう経緯でこの話になったの？」と歴史や背景をちゃんと聞きたがる",
                "バラバラに見える出来事を「要するにこういう流れだよね」とつなぎ合わせる",
                "相手の立場や心情を組み込んだ上で、納得感のある計画を立てる"
            ],
            cognitiveCosts: [
                "背景やストーリーの説明がゼロで、単発の作業だけをポイ投げされたとき",
                "人の気持ちやコンテキストを無視して、数字だけでバッサリ決められる瞬間",
                "脈絡のない指示が次々と飛んでくるカオスな環境"
            ]
        },
        [`${AXES.CONDITION}_${AXES.HOLD}`]: {
            title: "「リスクを見逃さない」慎重派の鑑定士タイプ",
            overview: "条件やルールをしっかり見極め、納得がいくまで焦って結論を出さない冷静な観察者。『一旦持ち帰って考えます』が最強の武器です。",
            frequentBehaviors: [
                "「まだ情報が足りないな」と感じたら、周りに流されず静観できる",
                "うまい話を聞いたとき、真っ先に「裏の条件やデメリットは？」と探る",
                "トラブルが起きたときほど、一歩引いて「で、何が起きてるの？」と冷静"
            ],
            cognitiveCosts: [
                "根拠や情報がスカスカなのに「今すぐ決めて！」と詰められる場面",
                "ノリと勢いだけで怪しい企画がどんどん進んでいく空間",
                "結論を急かされて、じっくり検証する時間を奪われること"
            ]
        },
        [`${AXES.COMPRESS}_${AXES.CONCRETE}`]: {
            title: "「本質を即スナイプする」実践派リアリストタイプ",
            overview: "『で、具体的に何をやればいいの？』を素早く見抜き、要点だけをズバッと掴む超実践派。無駄な長話は大嫌いで、スピーディーに成果を出したいタイプです。",
            frequentBehaviors: [
                "長すぎるメールやチャットを見ると、無意識に「結論はどこ？」と探す",
                "抽象的な議論より「たとえばどんな例がある？」と具体例で理解する",
                "学んだことや聞いた話を、一言のキャッチコピーに要約するのが得意"
            ],
            cognitiveCosts: [
                "結論がなかなか見えない、ダラダラした長時間の打ち合わせ",
                "「具体的にどう動けばいいか」が見えないフワッとした議論",
                "前置きや形容詞が多すぎて、本題になかなかたどりつかない説明"
            ]
        }
    };

    // 組み合わせが未定義の場合の汎用フォローバック
    function getFallbackProfile(top1, top2) {
        return {
            title: `「${AXIS_NAMES[top1]} × ${AXIS_NAMES[top2]}」ハイブリッドタイプ`,
            overview: `【${AXIS_NAMES[top1]}】の視点と【${AXIS_NAMES[top2]}】の視点を上手に切り替えながら、柔軟に情報を処理していくバランス感覚の持ち主です。`,
            frequentBehaviors: [
                `まず【${AXIS_NAMES[top1]}】の観点から「どういうことか」をピンポイントで捉える`,
                `必要に応じて【${AXIS_NAMES[top2]}】の視点を足して、理解をより深める`
            ],
            cognitiveCosts: [
                `自分の得意な【${AXIS_NAMES[top1]}】や【${AXIS_NAMES[top2]}】のアプローチが使えない極端な環境`
            ]
        };
    }

    // 状態管理変数
    let currentQuestionIndex = 0;
    let scores = {
        [AXES.STRUCTURE]: 0,
        [AXES.CONTEXT]: 0,
        [AXES.CONDITION]: 0,
        [AXES.CONCRETE]: 0,
        [AXES.COMPRESS]: 0,
        [AXES.HOLD]: 0
    };
    let chartInstance = null;

    // 初期化
    document.addEventListener("DOMContentLoaded", () => {
        showQuestion(currentQuestionIndex);
    });

    // 質問を表示する関数
    function showQuestion(index) {
        const q = QUESTIONS[index];
        document.getElementById("question-text").innerText = `Q${index + 1}. ${q.text}`;
        
        // 進捗更新
        const progressPercent = ((index + 1) / QUESTIONS.length) * 100;
        document.getElementById("progress-fill").style.width = `${progressPercent}%`;
        document.getElementById("progress-text").innerText = `${index + 1} / ${QUESTIONS.length}`;

        // 選択肢を描画
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.axis);
            optionsContainer.appendChild(btn);
        });
    }

    // 選択肢クリック時処理
    function selectOption(axis) {
        scores[axis] = (scores[axis] || 0) + 1;
        currentQuestionIndex++;

        if (currentQuestionIndex < QUESTIONS.length) {
            showQuestion(currentQuestionIndex);
        } else {
            showResult();
        }
    }

    // 偏り（分散）の判定関数
    function calculateDistribution(scoresArray) {
        const mean = scoresArray.reduce((a, b) => a + b, 0) / scoresArray.length;
        const variance = scoresArray.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / scoresArray.length;
        const stdDev = Math.sqrt(variance);

        if (stdDev >= 18) {
            return {
                label: "特化・尖り型プロファイル",
                description: "特定の情報処理アプローチに強いこだわりと抜群の強みを持つタイプです。得意な環境では圧倒的なパフォーマンスを発揮します。"
            };
        } else if (stdDev <= 8) {
            return {
                label: "万能・バランス型プロファイル",
                description: "状況や相手に合わせて、多面的な視点から柔軟に情報を処理できるオールラウンダータイプです。"
            };
        } else {
            return {
                label: "標準・ハイブリッド型プロファイル",
                description: "状況に応じた柔軟性を保ちつつ、特定の得意な処理軸を核にして思考を組み立てるタイプです。"
            };
        }
    }

    // 診断結果ロジック
    function generateDiagnosticResult(rawScores) {
        // 全体の合計選択数を求める
        const totalAnswers = Object.values(rawScores).reduce((sum, val) => sum + val, 0) || 1;
        
        // 100点満点換算（相対的割合）
        const normalized = {};
        for (const axis in rawScores) {
            normalized[axis] = Math.round((rawScores[axis] / totalAnswers) * 100 * 2.5); // スケール調整
        }

        // スコア順にソート
        const sortedAxes = Object.keys(rawScores).sort((a, b) => rawScores[b] - rawScores[a]);
        const top1 = sortedAxes[0];
        const top2 = sortedAxes[1];

        // 組み合わせプロファイル取得（順不同検索）
        const comboKey1 = `${top1}_${top2}`;
        const comboKey2 = `${top2}_${top1}`;
        const baseProfile = PROFILE_COMBINATIONS[comboKey1] || PROFILE_COMBINATIONS[comboKey2] || getFallbackProfile(top1, top2);

        // 分散判定
        const scoresValues = Object.values(normalized);
        const distribution = calculateDistribution(scoresValues);

        return {
            scores: normalized,
            primaryAxes: [top1, top2, sortedAxes[2]],
            distribution: distribution,
            display: {
                title: baseProfile.title || `${AXIS_NAMES[top1]} × ${AXIS_NAMES[top2]}`,
                distributionLabel: distribution.label,
                overview: baseProfile.overview + ' ' + distribution.description,
                frequentBehaviors: baseProfile.frequentBehaviors,
                cognitiveCosts: baseProfile.cognitiveCosts
            }
        };
    }

    // 結果表示関数
    function showResult() {
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-result").classList.remove("hidden");

        const result = generateDiagnosticResult(scores);

        // 各種テキスト埋め込み
        document.getElementById("result-title").innerText = result.display.title;
        document.getElementById("result-distribution-tag").innerText = result.display.distributionLabel;
        document.getElementById("result-overview").innerText = result.display.overview;

        // 上位軸リスト
        const topAxesList = document.getElementById("list-top-axes");
        topAxesList.innerHTML = "";
        result.primaryAxes.forEach(axis => {
            const li = document.createElement("li");
            li.innerText = `${AXIS_NAMES[axis]} (${result.scores[axis]} pt)`;
            topAxesList.appendChild(li);
        });

        // あるあるリスト
        const frequentList = document.getElementById("list-frequent");
        frequentList.innerHTML = "";
        result.display.frequentBehaviors.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            frequentList.appendChild(li);
        });

        // モヤッとコストリスト
        const costsList = document.getElementById("list-costs");
        costsList.innerHTML = "";
        result.display.cognitiveCosts.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item;
            costsList.appendChild(li);
        });

        // レーダーチャート描画
        renderChart(result.scores);
    }

    // Chart.js レーダーチャート
    function renderChart(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if (chartInstance) {
            chartInstance.destroy();
        }

        const labels = Object.keys(AXES).map(key => AXIS_NAMES[key]);
        const dataValues = Object.keys(AXES).map(key => scores[key]);

        chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: '思考処理傾向',
                    data: dataValues,
                    backgroundColor: 'rgba(37, 99, 235, 0.2)',
                    borderColor: 'rgba(37, 99, 235, 1)',
                    borderWidth: 2,
                    pointBackgroundColor: 'rgba(37, 99, 235, 1)'
                }]
            },
            options: {
                scales: {
                    r: {
                        angleLines: { color: '#e2e8f0' },
                        grid: { color: '#e2e8f0' },
                        suggestedMin: 0,
                        suggestedMax: 50,
                        ticks: { display: false }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // リセット（最初からやり直す）
    function resetQuiz() {
        currentQuestionIndex = 0;
        scores = {
            [AXES.STRUCTURE]: 0,
            [AXES.CONTEXT]: 0,
            [AXES.CONDITION]: 0,
            [AXES.CONCRETE]: 0,
            [AXES.COMPRESS]: 0,
            [AXES.HOLD]: 0
        };
        document.getElementById("screen-result").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        showQuestion(0);
    }
</script>
